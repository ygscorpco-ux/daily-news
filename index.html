<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- 모바일(카카오톡 인앱 브라우저) 최적화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4797" />
  <title>염광사 일간 뉴스</title>

  <style>
    :root{
      /* =========================
        ✅ 브랜드/스타일 수정 포인트
        ========================= */
      --brand: #1b4797;     /* 포인트 컬러 */
      --radius: 10px;       /* 이미지 라운드 */
      --gap: 12px;          /* 카드 간격(요구: 12px) */
      --placeholder: #f2f2f2;

      --text: #111;
      --muted: #999;
      --line: #eee;
      --bg: #fff;

      --maxw: 520px;        /* 큰 화면에서 너무 넓지 않게 */
      --todayMax: 500px;    /* ✅ 오늘의 카드뉴스 500x500(최대) */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* iOS에서 버튼 탭 하이라이트 제거 */
    button, a { -webkit-tap-highlight-color: transparent; }

    /* =========================
      1) 헤더 (sticky)
      ========================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--brand);
      color: #fff;
      padding-top: env(safe-area-inset-top);
    }
    .header-inner {
      height: 44px; /* 높이 최소화 */
      display: flex;
      align-items: center;
      padding: 0 16px;
    }
    .header-title {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
      레이아웃
      ========================= */
    .app {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 12px 16px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    .section { margin-top: 10px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0 10px;
    }
    .section-title {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.2px;
    }
    .section-sub {
      font-size: 12px;
      color: #666;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty-msg {
      padding: 18px 0;
      text-align: center;
      color: #777;
      font-size: 13px;
      font-weight: 700;
    }
    .error-msg {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #fff5f5;
      color: #c92a2a;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
    }

    /* =========================
      2) 캐러셀 (touch swipe)
      ========================= */
    .carousel { width: 100%; user-select: none; }
    .carousel-viewport {
      overflow: hidden;
      border-radius: var(--radius);
      touch-action: pan-y; /* 세로 스크롤 허용 + JS로 가로 스와이프 */
      background: var(--placeholder);
    }
    .carousel-track {
      display: flex;
      will-change: transform;
    }
    .slide {
      flex: 0 0 100%;
      padding: 0;
    }

    /* 1:1 비율 이미지 박스 */
    .img-box {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 */
      background: var(--placeholder);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .img-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; /* 로딩 전 숨김 */
      transition: opacity 180ms ease;
      display: block;
    }
    .img-box.is-loaded img { opacity: 1; }

    /* =========================
      ✅ 버그 1 수정:
      - img-error-text 기본 display:none
      - is-error 일 때만 보이게
      ========================= */
    .img-error-text {
      position: absolute;
      inset: 0;
      display: none; /* ✅ 기본적으로 숨김 */
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      color: #777;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }
    .img-box.is-error .img-error-text { display: flex; } /* ✅ 에러일 때만 표시 */

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #ddd;
    }
    .dot.active { background: var(--brand); }

    /* ✅ 오늘의 카드뉴스는 최대 500x500 */
    #todayCarouselMount {
      max-width: var(--todayMax);
      margin: 0 auto;
    }

    /* =========================
      3) 탭 네비게이션
      ========================= */
    .tabs {
      margin-top: 16px;
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 900;
      color: var(--muted);
      position: relative;
      cursor: pointer;
    }
    .tab.active { color: var(--brand); }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px; /* 요구: 2px 언더라인 */
      background: var(--brand);
    }

    /* =========================
      4) 아카이브 2열 그리드
      ========================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
      margin-top: 12px;
      transition: opacity 160ms ease; /* 탭 전환 fade */
      opacity: 1;
    }
    .grid.fade-out { opacity: 0; }

    .card {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .thumb { width: 100%; }
    .meta {
      padding: 0 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .card-date {
      font-size: 12px;
      color: #666;
      font-weight: 800;
    }
    .card-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* Skeleton(로딩용) */
    .skeleton { pointer-events: none; }
    .skeleton .img-box { background: var(--placeholder); }
    .sk-line {
      height: 12px;
      border-radius: 6px;
      background: #e9e9e9;
    }
    .sk-sm { width: 62%; }

    /* =========================
      5) 모달
      ========================= */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 100;
    }
    .modal.is-open { display: block; }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7); /* 요구: #000 opacity 0.7 */
    }
    .modal-panel {
      position: absolute;
      left: 16px;
      right: 16px;
      top: calc(16px + env(safe-area-inset-top));
      bottom: calc(16px + env(safe-area-inset-bottom));
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .modal-meta { min-width: 0; flex: 1; }
    .modal-date {
      font-size: 12px;
      color: #666;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
      word-break: break-word;
    }
    .modal-close {
      border: 0;
      background: transparent;
      font-size: 20px;
      font-weight: 900;
      color: #333;
      line-height: 1;
      padding: 6px 8px;
      cursor: pointer;
    }
    .modal-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-counter {
      text-align: center;
      font-size: 13px;
      color: #555;
      font-weight: 900;
    }

    /* =========================
      스크롤 잠금 (모달 오픈 시)
      ========================= */
    body.is-locked {
      position: fixed;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!-- 1) 헤더 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-title">염광사 일간 뉴스</div>
    </div>
  </header>

  <main class="app">
    <!-- 2) 오늘의 카드뉴스 -->
    <section class="section" aria-label="오늘의 카드뉴스">
      <div class="section-head">
        <h2 class="section-title">오늘의 카드뉴스</h2>
        <div class="section-sub" id="todayDateLabel"></div>
      </div>

      <div id="todayArea">
        <div id="todayCarouselMount"></div>
        <div class="empty-msg" id="todayEmpty" hidden>오늘의 뉴스가 준비 중입니다</div>
      </div>
    </section>

    <!-- 3) 탭 네비게이션 -->
    <nav class="tabs" aria-label="기간 선택">
      <button class="tab active" data-tab="week" type="button" aria-selected="true">이번 주</button>
      <button class="tab" data-tab="month" type="button" aria-selected="false">이번 달</button>
    </nav>

    <!-- 4) 아카이브 영역 -->
    <section class="section" aria-label="아카이브">
      <div class="section-head">
        <h2 class="section-title" id="archiveTitle">이번 주 아카이브</h2>
        <div class="section-sub" id="archiveSub"></div>
      </div>

      <div id="archiveArea">
        <div class="grid" id="archiveGrid"></div>
        <div class="empty-msg" id="archiveEmpty" hidden>표시할 뉴스가 없습니다</div>
        <div class="error-msg" id="archiveError" hidden></div>
      </div>
    </section>
  </main>

  <!-- 5) 모달 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="카드뉴스 상세">
      <div class="modal-top">
        <div class="modal-meta">
          <div class="modal-date" id="modalDate"></div>
          <div class="modal-title" id="modalTitle"></div>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="modal-body">
        <div id="modalCarouselMount"></div>
        <div class="modal-counter" id="modalCounter">0 / 0</div>
      </div>
    </div>
  </div>

  <script>
    /*
      염광사 일간 뉴스 - 단일 파일(index.html)
      ==========================================================
      ✅ 데이터 소스 (Google Sheets gviz)
      - URL: 아래 SHEETS_JSON_URL 사용
      - 컬럼(헤더): date, title, img1, img2, img3, img4, img5, img6
      - date는 "YYYY-MM-DD" 텍스트 권장 (예: 2026-02-26)
      - 이미지 URL 예:
        https://drive.google.com/uc?export=view&id=파일ID
    */

    /* =========================
      ✅ 관리자 설정(여기만 바꾸면 됨)
      ========================= */
    var SHEETS_JSON_URL = "https://docs.google.com/spreadsheets/d/1a26j950Nn67Qj1yYIyuuoMd6MIpC8YCcUDG2pyZjRrc/gviz/tq?tqx=out:json";

    var CONFIG = {
      weekDays: 7,     // "이번 주" = 최근 7일(오늘 포함)
      monthDays: 30,   // "이번 달" = 최근 30일(오늘 포함)

      queryDateColumn: "A",   // date 컬럼이 A열일 때 "A"
      dateColumnType: "text", // "text" 권장. (만약 date 컬럼이 '날짜' 형식이면 "date"로 변경)

      swipeThresholdPx: 40,   // 스와이프 판정 임계값
      lazyRootMargin: "200px" // 미리 로드 범위(스크롤/캐러셀 대비)
    };

    var state = {
      todayStr: "",
      activeTab: "week",
      cache: {
        week: { loaded: false, items: [] },
        month: { loaded: false, items: [] }
      },
      modalOpen: false,
      scrollY: 0
    };

    function $(sel, root) {
      return (root || document).querySelector(sel);
    }

    var els = {
      todayDateLabel: $("#todayDateLabel"),
      todayCarouselMount: $("#todayCarouselMount"),
      todayEmpty: $("#todayEmpty"),

      archiveTitle: $("#archiveTitle"),
      archiveSub: $("#archiveSub"),
      archiveGrid: $("#archiveGrid"),
      archiveEmpty: $("#archiveEmpty"),
      archiveError: $("#archiveError"),
      tabs: [].slice.call(document.querySelectorAll(".tab")),

      modal: $("#modal"),
      modalOverlay: $("#modalOverlay"),
      modalClose: $("#modalClose"),
      modalDate: $("#modalDate"),
      modalTitle: $("#modalTitle"),
      modalCarouselMount: $("#modalCarouselMount"),
      modalCounter: $("#modalCounter")
    };

    /* ---------------------------
      날짜 유틸 (KST 고정: UTC+9)
      - Intl(timeZone) 미지원 환경에서도 안전하게 동작하도록 고정 오프셋 계산
    --------------------------- */
    function pad2(n) { return String(n).padStart(2, "0"); }

    function formatUTCDateToYYYYMMDD(dt) {
      var y = dt.getUTCFullYear();
      var m = pad2(dt.getUTCMonth() + 1);
      var d = pad2(dt.getUTCDate());
      return y + "-" + m + "-" + d;
    }

    function getTodayKSTString() {
      var now = new Date();
      var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      var kstMs = utcMs + (9 * 60 * 60000); // UTC+9
      var kst = new Date(kstMs);
      return formatUTCDateToYYYYMMDD(kst);
    }

    function shiftDateString(baseYYYYMMDD, deltaDays) {
      // base를 UTC 기준 날짜(자정)로 만들고 deltaDays 적용
      var m = String(baseYYYYMMDD).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return baseYYYYMMDD;
      var y = Number(m[1]);
      var mo = Number(m[2]);
      var d = Number(m[3]);

      var dt = new Date(Date.UTC(y, mo - 1, d));
      dt.setUTCDate(dt.getUTCDate() + deltaDays);
      return formatUTCDateToYYYYMMDD(dt);
    }

    function formatDateKorean(dateStr) {
      // 화면 표시용: 2026.02.26
      var m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return dateStr;
      return m[1] + "." + m[2] + "." + m[3];
    }

    /* ---------------------------
      Lazy Loading (IntersectionObserver)
    --------------------------- */
    var imgObserver = null;

    function initLazyObserver() {
      if (imgObserver) return;
      if (!("IntersectionObserver" in window)) return;

      imgObserver = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          if (!entry.isIntersecting) continue;
          var img = entry.target;
          loadImgNow(img);
          imgObserver.unobserve(img);
        }
      }, { root: null, rootMargin: CONFIG.lazyRootMargin, threshold: 0.01 });
    }

    function observeLazyImgs(rootEl) {
      if (!rootEl) return;
      var imgs = rootEl.querySelectorAll("img[data-src]");
      if (!imgs || !imgs.length) return;

      // 구형 fallback: IO 없으면 즉시 로드
      if (!("IntersectionObserver" in window)) {
        for (var i = 0; i < imgs.length; i++) loadImgNow(imgs[i]);
        return;
      }

      initLazyObserver();
      for (var j = 0; j < imgs.length; j++) imgObserver.observe(imgs[j]);
    }

    function loadImgNow(img) {
      if (!img) return;
      var src = img.getAttribute("data-src");
      if (!src) return;
      if (img.getAttribute("data-loaded") === "1") return;

      img.setAttribute("data-loaded", "1");
      img.src = src;

      var box = closest(img, ".img-box");
      if (box) box.classList.add("is-loading");

      img.addEventListener("load", function() {
        if (box) {
          box.classList.remove("is-loading");
          box.classList.add("is-loaded");
        }
      }, { once: true });

      img.addEventListener("error", function() {
        if (box) {
          box.classList.remove("is-loading");
          box.classList.add("is-error");
          var err = box.querySelector(".img-error-text");
          if (err) err.hidden = false;
        }
      }, { once: true });
    }

    function ensureImgLoaded(img) {
      if (!img) return;
      if (img.getAttribute("data-src") && img.getAttribute("data-loaded") !== "1") {
        loadImgNow(img);
      }
    }

    function closest(el, selector) {
      if (!el) return null;
      if (el.closest) return el.closest(selector);
      // 매우 구형 브라우저 fallback
      while (el) {
        if (matches(el, selector)) return el;
        el = el.parentElement;
      }
      return null;
    }

    function matches(el, selector) {
      if (!el) return false;
      var p = Element.prototype;
      var f = p.matches || p.webkitMatchesSelector || p.msMatchesSelector;
      if (f) return f.call(el, selector);
      return false;
    }

    /* ---------------------------
      Google Sheets (gviz) Fetch + 파싱
    --------------------------- */
    function buildGvizUrl(baseUrl, query) {
      // URL() 지원 환경: 파라미터 안전하게 set
      try {
        var u = new URL(baseUrl);
        u.searchParams.set("tqx", "out:json");
        if (query) u.searchParams.set("tq", query);
        return u.toString();
      } catch (e) {
        // fallback: 문자열로 이어붙이기
        var url = String(baseUrl || "");
        var hasQ = url.indexOf("?") >= 0;

        // tqx가 이미 있으면 대충 유지(중복되어도 대부분 동작)
        if (!/[\?&]tqx=/.test(url)) {
          url += (hasQ ? "&" : "?") + "tqx=out:json";
          hasQ = true;
        }
        if (query) url += (hasQ ? "&" : "?") + "tq=" + encodeURIComponent(query);
        return url;
      }
    }

    function buildQuerySince(startDateStr) {
      // ✅ 시트 컬럼: date(A), title(B), img1(C) ... img6(H)
      var A = CONFIG.queryDateColumn;

      // date 컬럼 타입에 따라 where 문법 차이
      // - text(권장): where A >= '2026-02-19'
      // - date:       where A >= date '2026-02-19'
      var literal = (CONFIG.dateColumnType === "date")
        ? ("date '" + startDateStr + "'")
        : ("'" + startDateStr + "'");

      // A~H 선택 (I 포함하면 시트에 없을 때 에러 날 수 있어 제외)
      return "select A,B,C,D,E,F,G,H where " + A + " >= " + literal + " order by " + A + " desc";
    }

    function fetchText(url) {
      // fetch 지원: fetch, 미지원: XHR fallback
      if (typeof window.fetch === "function") {
        return fetch(url, { method: "GET", credentials: "omit" }).then(function(res) {
          if (!res.ok) throw new Error("시트 데이터를 불러오지 못했습니다. (HTTP " + res.status + ")");
          return res.text();
        });
      }

      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
          else reject(new Error("시트 데이터를 불러오지 못했습니다. (HTTP " + xhr.status + ")"));
        };
        xhr.onerror = function() { reject(new Error("네트워크 오류로 시트 데이터를 불러오지 못했습니다.")); };
        xhr.send();
      });
    }

    function extractGvizObjectString(text) {
      // gviz 응답 예: google.visualization.Query.setResponse({...});
      var m = String(text).match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\)\s*;?\s*$/);
      if (!m) throw new Error("gviz 응답 형식이 예상과 다릅니다.");
      return m[1];
    }

    function parseGviz(text) {
      var objStr = extractGvizObjectString(text);

      // 1) JSON.parse 시도
      try {
        return JSON.parse(objStr);
      } catch (e) {
        // 2) date 컬럼이 날짜 타입이면 new Date(...) 포함되어 JSON.parse 실패할 수 있음
        try {
          // eslint-disable-next-line no-new-func
          return (new Function("return (" + objStr + ");"))();
        } catch (e2) {
          throw new Error("gviz 파싱 실패: date 컬럼을 텍스트(YYYY-MM-DD)로 권장합니다.");
        }
      }
    }

    function normalizeDateCell(val) {
      if (!val) return "";

      // Date 객체인 경우
      if (val instanceof Date) {
        var y = val.getFullYear();
        var m = pad2(val.getMonth() + 1);
        var d = pad2(val.getDate());
        return y + "-" + m + "-" + d;
      }

      var s = String(val).trim();

      // "Date(YYYY,MM,DD)" 문자열 형태(월 0-base) 대응
      var dm = s.match(/^Date\((\d+),\s*(\d+),\s*(\d+)\)$/);
      if (dm) {
        var yy = Number(dm[1]);
        var mo = pad2(Number(dm[2]) + 1);
        var dd = pad2(Number(dm[3]));
        return yy + "-" + mo + "-" + dd;
      }

      // YYYY-M-D / YYYY.MM.DD 등 대응
      var iso = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
      if (iso) return iso[1] + "-" + pad2(iso[2]) + "-" + pad2(iso[3]);

      return s;
    }

    function toItemListFromGviz(gviz) {
      if (!gviz || !gviz.table || !Array.isArray(gviz.table.rows)) return [];

      var cols = gviz.table.cols || [];
      var labelToIdx = {};
      for (var i = 0; i < cols.length; i++) {
        var c = cols[i] || {};
        var label = (c.label != null) ? String(c.label).trim().toLowerCase() : "";
        if (label) labelToIdx[label] = i;
      }

      // 헤더(label) 우선, 없으면 위치 fallback
      var idxDate = (typeof labelToIdx["date"] === "number") ? labelToIdx["date"] : 0;
      var idxTitle = (typeof labelToIdx["title"] === "number") ? labelToIdx["title"] : 1;

      // img1~img6: label 우선, 없으면 (date=0,title=1) 다음부터 순서대로 fallback(2~7)
      var imgIdxs = [];
      for (var k = 1; k <= 6; k++) {
        var key = "img" + k;
        var idx = labelToIdx[key];
        if (typeof idx !== "number") idx = 1 + k; // img1=2 ... img6=7
        imgIdxs.push(idx);
      }

      var items = [];
      var rows = gviz.table.rows;

      for (var r = 0; r < rows.length; r++) {
        var row = rows[r] || {};
        var cells = row.c || [];

        function getV(idx) {
          return (cells[idx] && typeof cells[idx].v !== "undefined") ? cells[idx].v : "";
        }

        var date = normalizeDateCell(getV(idxDate));
        var title = String(getV(idxTitle) || "").trim();

        var images = [];
        for (var j = 0; j < imgIdxs.length; j++) {
          var v = String(getV(imgIdxs[j]) || "").trim();
          if (v) images.push(v);
        }

        // 최소 조건: date 필수 + (title 또는 images)
        if (!date) continue;
        if (!title && images.length === 0) continue;

        items.push({ date: date, title: title, images: images });
      }

      // 날짜 역순 정렬 (YYYY-MM-DD 문자열 비교 OK)
      items.sort(function(a, b) {
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
      });

      return items;
    }

    function fetchItemsSince(startDateStr) {
      if (!SHEETS_JSON_URL) {
        return Promise.reject(new Error("SHEETS_JSON_URL이 비어 있습니다."));
      }

      var query = buildQuerySince(startDateStr);
      var url = buildGvizUrl(SHEETS_JSON_URL, query);

      return fetchText(url).then(function(text) {
        var gviz = parseGviz(text);

        if (gviz.status && gviz.status === "error") {
          var msg = "시트 응답이 에러입니다.";
          if (gviz.errors && gviz.errors[0]) {
            msg = gviz.errors[0].detailed_message || gviz.errors[0].message || msg;
          }
          throw new Error(msg);
        }

        return toItemListFromGviz(gviz);
      });
    }

    /* ---------------------------
      XSS 방지 (title 등 안전 출력)
    --------------------------- */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function escapeHtmlAttr(str) {
      return escapeHtml(String(str)).replace(/\n/g, " ");
    }

    /* ---------------------------
      UI 렌더링
    --------------------------- */
    function setEmpty(el, on) { if (el) el.hidden = !on; }

    function setArchiveError(msg) {
      els.archiveError.textContent = msg || "";
      els.archiveError.hidden = !msg;
    }

    function getRangeStartForTab(tab) {
      if (tab === "month") return shiftDateString(state.todayStr, -(CONFIG.monthDays - 1));
      return shiftDateString(state.todayStr, -(CONFIG.weekDays - 1));
    }

    function updateRangeLabel(tab) {
      var start = getRangeStartForTab(tab);
      var end = state.todayStr;

      els.archiveSub.textContent = (tab === "week")
        ? ("최근 " + CONFIG.weekDays + "일 (" + formatDateKorean(start) + " ~ " + formatDateKorean(end) + ")")
        : ("최근 " + CONFIG.monthDays + "일 (" + formatDateKorean(start) + " ~ " + formatDateKorean(end) + ")");
    }

    function setActiveTab(tab) {
      state.activeTab = tab;

      for (var i = 0; i < els.tabs.length; i++) {
        var btn = els.tabs[i];
        var isActive = btn.getAttribute("data-tab") === tab;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-selected", isActive ? "true" : "false");
      }

      els.archiveTitle.textContent = (tab === "week") ? "이번 주 아카이브" : "이번 달 아카이브";
      updateRangeLabel(tab);
    }

    function createImgBox(opt) {
      var src = opt.src || "";
      var alt = opt.alt || "";

      var box = document.createElement("div");
      box.className = "img-box is-loading";
      box.innerHTML =
        '<img loading="lazy" decoding="async" data-src="' + escapeHtmlAttr(src) + '" alt="' + escapeHtmlAttr(alt) + '">' +
        '<span class="img-error-text" hidden>이미지를 불러올 수 없어요</span>';

      return box;
    }

    function createCarousel(opt) {
      var images = opt.images || [];
      var mode = opt.mode || "today";
      var onIndexChange = opt.onIndexChange;

      var root = document.createElement("div");
      root.className = "carousel";

      var viewport = document.createElement("div");
      viewport.className = "carousel-viewport";

      var track = document.createElement("div");
      track.className = "carousel-track";

      var dots = document.createElement("div");
      dots.className = "dots";
      dots.hidden = images.length <= 1;

      // 이미지가 0개면, 안내 슬라이드 1개 생성(안전장치)
      var imgList = images.length ? images : [""];

      for (var i = 0; i < imgList.length; i++) {
        var src = imgList[i];

        var slide = document.createElement("div");
        slide.className = "slide";

        if (src) {
          slide.appendChild(createImgBox({
            src: src,
            alt: (mode === "modal" ? "카드뉴스" : "오늘의 카드뉴스") + " " + (i + 1)
          }));
        } else {
          // 이미지 없을 때 placeholder
          var box = document.createElement("div");
          box.className = "img-box is-error";
          box.innerHTML = '<span class="img-error-text">이미지가 없습니다</span>';
          slide.appendChild(box);
        }

        track.appendChild(slide);

        var dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("aria-hidden", "true");
        dots.appendChild(dot);
      }

      viewport.appendChild(track);
      root.appendChild(viewport);
      root.appendChild(dots);

      /* =========================
        ✅ 버그 2 수정(1):
        - 초기 인덱스를 0으로 확실히 고정
        ========================= */
      var idx = 0;
      var width = 1;

      function measure() {
        width = viewport.getBoundingClientRect().width || 1;
        applyTransform(false);
      }

      function applyTransform(withAnim) {
        if (withAnim === void 0) withAnim = true;

        track.style.transition = withAnim ? "transform 220ms ease" : "none";
        track.style.transform = "translate3d(" + (-idx * width) + "px, 0, 0)";

        // dots 업데이트
        var dotEls = dots.querySelectorAll(".dot");
        for (var i = 0; i < dotEls.length; i++) {
          dotEls[i].classList.toggle("active", i === idx);
        }

        // 현재/이웃 슬라이드 이미지는 즉시 로드(Observer 누락 대비)
        var slides = track.children;
        var cur = slides[idx] && slides[idx].querySelector("img[data-src]");
        var prev = slides[idx - 1] && slides[idx - 1].querySelector("img[data-src]");
        var next = slides[idx + 1] && slides[idx + 1].querySelector("img[data-src]");
        ensureImgLoaded(cur);
        ensureImgLoaded(prev);
        ensureImgLoaded(next);

        if (typeof onIndexChange === "function") onIndexChange(idx, imgList.length);
      }

      function clampIndex(n) {
        var max = Math.max(0, imgList.length - 1);
        if (n < 0) return 0;
        if (n > max) return max;
        return n;
      }

      function goTo(n, withAnim) {
        if (withAnim === void 0) withAnim = true;
        idx = clampIndex(n);
        applyTransform(withAnim);
      }

      /* 터치 스와이프 구현 */
      var startX = 0, startY = 0;
      var dragging = false;
      var dragDx = 0;
      var isHorizontal = null;

      function onTouchStart(e) {
        if (!e.touches || e.touches.length !== 1) return;
        dragging = true;
        isHorizontal = null;
        dragDx = 0;

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        track.style.transition = "none";
      }

      function onTouchMove(e) {
        if (!dragging || !e.touches || e.touches.length !== 1) return;

        var x = e.touches[0].clientX;
        var y = e.touches[0].clientY;
        var dx = x - startX;
        var dy = y - startY;

        if (isHorizontal === null) {
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }

        if (!isHorizontal) {
          // 세로 스크롤이면 드래그 종료
          dragging = false;
          track.style.transition = "transform 220ms ease";
          applyTransform(true);
          return;
        }

        // 가로 스와이프: 페이지 스크롤 방지
        e.preventDefault();

        dragDx = dx;
        track.style.transform = "translate3d(" + ((-idx * width) + dx) + "px, 0, 0)";
      }

      function onTouchEnd() {
        if (!dragging) return;
        dragging = false;

        if (Math.abs(dragDx) >= CONFIG.swipeThresholdPx) {
          if (dragDx < 0) goTo(idx + 1, true);
          else goTo(idx - 1, true);
        } else {
          goTo(idx, true);
        }
        dragDx = 0;
      }

      /* =========================
        ✅ 버그 2 수정(2):
        - PC 마우스 드래그로도 스와이프 가능하게 추가
        - mousedown/mousemove/mouseup
        ========================= */
      var mStartX = 0, mStartY = 0;
      var mDragging = false;
      var mDragDx = 0;
      var mIsHorizontal = null;

      function detachMouseListeners() {
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        window.removeEventListener("mouseleave", onMouseUp);
      }

      function onMouseDown(e) {
        // 좌클릭만
        if (e.button !== 0) return;

        mDragging = true;
        mIsHorizontal = null;
        mDragDx = 0;

        mStartX = e.clientX;
        mStartY = e.clientY;
        track.style.transition = "none";

        // 드래그 중 선택/이미지 드래그 방지
        e.preventDefault();

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
        window.addEventListener("mouseleave", onMouseUp);
      }

      function onMouseMove(e) {
        if (!mDragging) return;

        var dx = e.clientX - mStartX;
        var dy = e.clientY - mStartY;

        if (mIsHorizontal === null) {
          mIsHorizontal = Math.abs(dx) > Math.abs(dy);
        }

        if (!mIsHorizontal) {
          // 세로 이동이 크면 드래그 종료(스크롤/의도치 않은 드래그 방지)
          mDragging = false;
          detachMouseListeners();
          track.style.transition = "transform 220ms ease";
          applyTransform(true);
          return;
        }

        e.preventDefault();

        mDragDx = dx;
        track.style.transform = "translate3d(" + ((-idx * width) + dx) + "px, 0, 0)";
      }

      function onMouseUp() {
        if (!mDragging) return;
        mDragging = false;
        detachMouseListeners();

        if (Math.abs(mDragDx) >= CONFIG.swipeThresholdPx) {
          if (mDragDx < 0) goTo(idx + 1, true);
          else goTo(idx - 1, true);
        } else {
          goTo(idx, true);
        }
        mDragDx = 0;
      }

      // iOS에서 preventDefault 동작을 위해 touchmove는 passive:false
      viewport.addEventListener("touchstart", onTouchStart, { passive: true });
      viewport.addEventListener("touchmove", onTouchMove, { passive: false });
      viewport.addEventListener("touchend", onTouchEnd, { passive: true });
      viewport.addEventListener("touchcancel", onTouchEnd, { passive: true });

      // ✅ PC 마우스 드래그 이벤트 추가
      viewport.addEventListener("mousedown", onMouseDown);

      // 이미지 기본 drag(고스트 이미지) 방지
      viewport.addEventListener("dragstart", function(e){ e.preventDefault(); });

      window.addEventListener("resize", measure, { passive: true });

      // 초기
      idx = 0;             // ✅ 확실히 0으로 고정
      measure();
      goTo(0, false);      // ✅ 첫 슬라이드로 확실히 이동
      observeLazyImgs(root);

      return { el: root, goTo: goTo, getIndex: function(){ return idx; }, getCount: function(){ return imgList.length; } };
    }

    function findItemByDate(items, dateStr) {
      if (!items) return null;
      for (var i = 0; i < items.length; i++) {
        if (items[i].date === dateStr) return items[i];
      }
      return null;
    }

    function renderToday(items) {
      els.todayCarouselMount.innerHTML = "";
      setEmpty(els.todayEmpty, false);

      var todayStr = state.todayStr;
      els.todayDateLabel.textContent = formatDateKorean(todayStr);

      // 같은 날짜가 여러 행이면, 정렬상 첫 번째(최신) 사용
      var todayItem = findItemByDate(items || [], todayStr);

      if (!todayItem || !todayItem.images || todayItem.images.length === 0) {
        setEmpty(els.todayEmpty, true);
        return;
      }

      var carousel = createCarousel({
        images: todayItem.images,
        mode: "today",
        onIndexChange: function(){ /* today 섹션은 dots만 사용 */ }
      });
      els.todayCarouselMount.appendChild(carousel.el);
    }

    function renderArchiveSkeleton() {
      els.archiveGrid.innerHTML = "";
      var frag = document.createDocumentFragment();

      for (var i = 0; i < 4; i++) {
        var sk = document.createElement("div");
        sk.className = "card skeleton";
        sk.innerHTML =
          '<div class="thumb"><div class="img-box is-loading"></div></div>' +
          '<div class="meta">' +
          '  <div class="sk-line sk-sm"></div>' +
          '  <div class="sk-line"></div>' +
          '</div>';
        frag.appendChild(sk);
      }

      els.archiveGrid.appendChild(frag);
    }

    function renderArchive(items, opt) {
      opt = opt || {};
      var fade = (typeof opt.fade === "boolean") ? opt.fade : true;

      setArchiveError("");
      setEmpty(els.archiveEmpty, false);

      if (!items || items.length === 0) {
        els.archiveGrid.innerHTML = "";
        setEmpty(els.archiveEmpty, true);
        return;
      }

      if (fade) {
        els.archiveGrid.classList.add("fade-out");
        setTimeout(function() { els.archiveGrid.classList.remove("fade-out"); }, 160);
      }

      // 날짜 역순 정렬(안전)
      var sorted = items.slice().sort(function(a, b) {
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
      });

      var frag = document.createDocumentFragment();

      for (var i = 0; i < sorted.length; i++) {
        var item = sorted[i];

        var card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.setAttribute("aria-label", item.date + " " + (item.title || "") + " 상세 보기");

        var thumb = document.createElement("div");
        thumb.className = "thumb";

        var thumbSrc = (item.images && item.images[0]) ? item.images[0] : "";
        if (thumbSrc) {
          thumb.appendChild(createImgBox({ src: thumbSrc, alt: item.date + " 썸네일" }));
        } else {
          var box = document.createElement("div");
          box.className = "img-box is-error";
          box.innerHTML = '<span class="img-error-text">썸네일 없음</span>';
          thumb.appendChild(box);
        }

        var meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML =
          '<div class="card-date">' + escapeHtml(formatDateKorean(item.date)) + '</div>' +
          '<div class="card-title">' + escapeHtml(item.title || "") + '</div>';

        card.appendChild(thumb);
        card.appendChild(meta);

        (function(it){
          card.addEventListener("click", function(){ openModal(it); });
        })(item);

        frag.appendChild(card);
      }

      els.archiveGrid.innerHTML = "";
      els.archiveGrid.appendChild(frag);
      observeLazyImgs(els.archiveGrid);
    }

    /* ---------------------------
      Modal
    --------------------------- */
    function lockBodyScroll() {
      state.scrollY = window.scrollY || 0;
      document.body.classList.add("is-locked");
      document.body.style.top = "-" + state.scrollY + "px";
    }

    function unlockBodyScroll() {
      document.body.classList.remove("is-locked");
      document.body.style.top = "";
      window.scrollTo(0, state.scrollY);
    }

    function openModal(item) {
      if (!item) return;
      state.modalOpen = true;

      els.modalDate.textContent = formatDateKorean(item.date);
      els.modalTitle.textContent = item.title || "";

      els.modalCarouselMount.innerHTML = "";
      var total = Math.max(1, (item.images || []).length);
      els.modalCounter.textContent = "1 / " + total;

      var carousel = createCarousel({
        images: item.images || [],
        mode: "modal",
        onIndexChange: function(i, total) {
          els.modalCounter.textContent = (i + 1) + " / " + total;
        }
      });

      els.modalCarouselMount.appendChild(carousel.el);

      els.modal.classList.add("is-open");
      els.modal.setAttribute("aria-hidden", "false");
      lockBodyScroll();

      // (선택) 안드로이드 뒤로가기 버튼으로 모달만 닫히게
      try { history.pushState({ modal: true }, ""); } catch (e) {}
    }

    function closeModal(fromPopState) {
      if (!state.modalOpen) return;
      state.modalOpen = false;

      els.modal.classList.remove("is-open");
      els.modal.setAttribute("aria-hidden", "true");
      els.modalCarouselMount.innerHTML = "";
      unlockBodyScroll();

      // X/배경 클릭으로 닫을 때 history.back()으로 뒤로가기와 동작 맞춤
      if (!fromPopState) {
        try { history.back(); } catch (e) {}
      }
    }

    els.modalOverlay.addEventListener("click", function(){ closeModal(false); });
    els.modalClose.addEventListener("click", function(){ closeModal(false); });
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeModal(false);
    });
    window.addEventListener("popstate", function() {
      if (state.modalOpen) closeModal(true);
    });

    /* ---------------------------
      탭 + 데이터 로딩
    --------------------------- */
    function filterItemsToRange(items, startDateStr, endDateStr) {
      // YYYY-MM-DD이면 문자열 비교로 범위 필터 가능
      return (items || []).filter(function(it) {
        return it.date >= startDateStr && it.date <= endDateStr;
      });
    }

    function ensureTabData(tab) {
      var bucket = state.cache[tab];
      if (bucket.loaded) return Promise.resolve(bucket.items);

      var start = getRangeStartForTab(tab);
      var end = state.todayStr;

      return fetchItemsSince(start).then(function(raw) {
        var ranged = filterItemsToRange(raw, start, end);
        bucket.items = ranged;
        bucket.loaded = true;
        return bucket.items;
      }).catch(function(e) {
        bucket.items = [];
        bucket.loaded = true; // 무한 재시도 방지(원하면 false로 바꾸면 됨)
        setArchiveError(e.message || "데이터를 불러오지 못했습니다.");
        return bucket.items;
      });
    }

    function onTabClick(tab) {
      if (tab === state.activeTab) return;

      setActiveTab(tab);

      // 아직 안 불러온 탭이면 skeleton 표시 후 fetch
      if (!state.cache[tab].loaded) {
        renderArchiveSkeleton();
      }

      ensureTabData(tab).then(function(items) {
        renderArchive(items, { fade: true });
      });
    }

    for (var i = 0; i < els.tabs.length; i++) {
      (function(btn){
        btn.addEventListener("click", function(){
          onTabClick(btn.getAttribute("data-tab"));
        });
      })(els.tabs[i]);
    }

    /* ---------------------------
      초기 실행
      - ✅ 요구사항: 초기 로딩은 "오늘 + 최근 7일"만 fetch
    --------------------------- */
    (function init() {
      state.todayStr = getTodayKSTString();
      setActiveTab("week");

      renderArchiveSkeleton();

      ensureTabData("week").then(function(weekItems) {
        // 오늘 섹션
        renderToday(weekItems);
        // 아카이브(이번 주)
        renderArchive(weekItems, { fade: false });
      });
    })();
  </script>
