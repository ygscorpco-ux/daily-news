<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- 카카오톡 인앱 브라우저 최적화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4797" />
  <title>염광사 일간 뉴스</title>

  <style>
    :root{
      --brand:#1b4797;
      --bg:#ffffff;
      --text:#111;
      --sub:#666;
      --muted:#999;
      --line:#eee;
      --placeholder:#f2f2f2;

      --radius:10px;
      --maxw:520px;

      --padX:16px;
      --padY:14px;

      --shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    /* =========================
      Header (sticky)
    ========================= */
    .app-header{
      position: sticky;
      top:0;
      z-index:50;
      background:var(--brand);
      color:#fff;
      padding-top: env(safe-area-inset-top);
    }
    .header-inner{
      height:48px; /* 요구사항: 48px */
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 var(--padX);
    }
    .header-title{
      font-weight:900;
      font-size:16px;
      letter-spacing:-0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .header-date{
      font-weight:800;
      font-size:13px;
      opacity:0.95;
      white-space:nowrap;
    }

    /* =========================
      Layout
    ========================= */
    .app{
      max-width:var(--maxw);
      margin:0 auto;
      padding: var(--padY) var(--padX);
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    .section-title{
      font-size:13px;
      font-weight:900;
      color:var(--text);
      letter-spacing:-0.2px;
      margin:0 0 10px;
    }

    .empty-msg{
      padding:16px 0;
      text-align:center;
      color:#777;
      font-size:13px;
      font-weight:800;
    }

    .error-msg{
      margin-top:10px;
      padding:12px;
      border-radius:10px;
      background:#fff5f5;
      color:#c92a2a;
      font-size:12px;
      font-weight:800;
      line-height:1.45;
    }

    /* =========================
      Hero (오늘의 카드뉴스)
      - 좌우 패딩 없이 full width (앱 컨테이너 내에서 full-bleed)
    ========================= */
    .hero-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .hero-bleed{
      position:relative;
      margin-left: calc(var(--padX) * -1);
      margin-right: calc(var(--padX) * -1);
    }

    /* share button (우하단) */
    .share-btn{
      position:absolute;
      right:12px;
      bottom:12px;
      border:1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.92);
      color:#111;
      font-weight:900;
      font-size:12px;
      padding:10px 12px;
      border-radius:999px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.10);
      cursor:pointer;
      backdrop-filter: blur(6px);
    }
    .share-btn:active{ transform: translateY(1px); }

    .today-title{
      margin-top:10px;
      font-weight:900;
      font-size:14px;
      line-height:1.25;
      letter-spacing:-0.2px;
      white-space:nowrap;          /* 요구사항: 제목 1줄 */
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* =========================
      Carousel
      - 1:1 정사각형
    ========================= */
    .carousel{ width:100%; user-select:none; }
    .carousel-viewport{
      overflow:hidden;
      border-radius: var(--radius);
      background: var(--placeholder);
      touch-action: pan-y; /* 세로 스크롤 허용 + JS로 가로 스와이프 */
    }
    .carousel-track{
      display:flex;
      will-change: transform;
    }
    .slide{
      flex: 0 0 100%;
      padding:0;
    }

    /* 이미지 박스 (1:1) */
    .img-box{
      position:relative;
      width:100%;
      padding-top:100%;
      background: var(--placeholder);
      border-radius: var(--radius);
      overflow:hidden;
    }
    .img-box img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      opacity:0;
      transition: opacity 180ms ease;
      display:block;
    }
    .img-box.is-loaded img{ opacity:1; }

    /* ✅ 요구사항: 에러 텍스트는 기본 display:none, is-error일 때만 보임 */
    .img-error-text{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:10px;
      text-align:center;
      color:#777;
      font-size:12px;
      font-weight:900;
      line-height:1.35;
    }
    .img-box.is-error .img-error-text{ display:flex; }

    /* dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:6px;
      margin-top:8px;
    }
    .dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background:#ddd;
    }
    .dot.active{ background: var(--brand); }

    /* =========================
      Archive (지난 뉴스) - Accordion
    ========================= */
    .archive{
      margin-top:18px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }

    .archive-toggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:14px;
      letter-spacing:-0.2px;
      color:var(--text);
    }

    .archive-range{
      margin:10px 2px 8px;
      font-size:12px;
      font-weight:800;
      color:var(--sub);
      white-space:nowrap;
    }

    .archive-panel{
      margin-top:10px;
    }

    .archive-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .news-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      cursor:pointer;
      text-align:left;
    }

    .thumb{
      width:56px;           /* 요구사항: 56x56 */
      flex: 0 0 56px;
    }
    .thumb .img-box{
      padding-top:100%;
      border-radius:12px;   /* 썸네일 라운드 */
    }

    .news-meta{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .news-date{
      font-size:12px;
      font-weight:900;
      color:var(--sub);
      white-space:nowrap;
    }
    .news-title{
      font-size:13px;
      font-weight:900;
      color:var(--text);
      line-height:1.25;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      word-break:break-word;
    }

    /* =========================
      Modal
    ========================= */
    .modal{
      position:fixed;
      inset:0;
      display:none;
      z-index:100;
    }
    .modal.is-open{ display:block; }
    .modal-overlay{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.7);
    }
    .modal-panel{
      position:absolute;
      left:16px;
      right:16px;
      top: calc(16px + env(safe-area-inset-top));
      bottom: calc(16px + env(safe-area-inset-bottom));
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow: var(--shadow);
    }
    .modal-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line);
    }
    .modal-meta{ min-width:0; flex:1; }
    .modal-date{
      font-size:12px;
      color:var(--sub);
      font-weight:900;
      margin-bottom:4px;
    }
    .modal-title{
      font-size:14px;
      font-weight:900;
      color:var(--text);
      line-height:1.25;
      word-break:break-word;
    }
    .modal-close{
      border:0;
      background:transparent;
      font-size:20px;
      font-weight:900;
      color:#333;
      line-height:1;
      padding:6px 8px;
      cursor:pointer;
    }
    .modal-body{
      padding:12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-counter{
      text-align:center;
      font-size:13px;
      color:#555;
      font-weight:900;
    }

    /* =========================
      Scroll lock (모달 오픈 시)
    ========================= */
    body.is-locked{
      position:fixed;
      left:0; right:0;
      width:100%;
      overflow:hidden;
    }

    /* =========================
      Toast
    ========================= */
    .toast{
      position:fixed;
      left:50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(0,0,0,0.78);
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      opacity:0;
      pointer-events:none;
      transition: opacity 160ms ease;
      z-index:200;
      max-width: calc(100% - 24px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.is-show{ opacity:1; }

    /* 하단 여백(카톡 하단바 고려) */
    .bottom-pad{
      height: 10px;
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-title">염광사 일간 뉴스</div>
      <div class="header-date" id="headerDate"></div>
    </div>
  </header>

  <main class="app">
    <!-- 오늘의 카드뉴스 -->
    <section aria-label="오늘의 카드뉴스">
      <div class="hero-head">
        <h2 class="section-title" style="margin:0;">오늘의 카드뉴스</h2>
      </div>

      <div class="hero-bleed" id="todayBleed">
        <div id="todayCarouselMount"></div>
        <button class="share-btn" id="shareBtn" type="button" hidden>공유하기</button>
      </div>

      <div id="todayTitle" class="today-title"></div>
      <div class="empty-msg" id="todayEmpty" hidden>오늘의 뉴스가 준비 중입니다</div>
    </section>

    <!-- 지난 뉴스(아코디언) -->
    <section class="archive" aria-label="지난 뉴스">
      <button class="archive-toggle" id="archiveToggle" type="button" aria-expanded="false">
        <span>지난 뉴스</span>
        <span id="archiveChev">▼</span>
      </button>

      <div class="archive-panel" id="archivePanel" hidden>
        <div class="archive-range" id="archiveRange"></div>
        <div class="archive-list" id="archiveList"></div>
        <div class="empty-msg" id="archiveEmpty" hidden>표시할 뉴스가 없습니다</div>
        <div class="error-msg" id="archiveError" hidden></div>
      </div>
    </section>

    <div class="bottom-pad"></div>
  </main>

  <!-- 모달 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="카드뉴스 상세">
      <div class="modal-top">
        <div class="modal-meta">
          <div class="modal-date" id="modalDate"></div>
          <div class="modal-title" id="modalTitle"></div>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="modal-body">
        <div id="modalCarouselMount"></div>
        <div class="modal-counter" id="modalCounter">0 / 0</div>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script>
    /*
      ==========================================================
      염광사 일간 카드뉴스 (단일 파일 index.html)
      - 데이터: Google Sheets gviz(JSON)
      - 이미지: 시트에 들어있는 URL 사용 (GitHub Pages 이미지 URL 권장)
      - 환경: 카카오톡 인앱 브라우저 대응 (터치 + PC 드래그)
      ==========================================================
    */

    /* =========================
      관리자 설정
    ========================= */
    var SHEETS_JSON_URL = "https://docs.google.com/spreadsheets/d/1a26j950Nn67Qj1yYIyuuoMd6MIpC8YCcUDG2pyZjRrc/gviz/tq?tqx=out:json";

    var CONFIG = {
      archiveDays: 7,           // 어제(D-1) ~ 7일 전(D-7)
      queryDateColumn: "A",     // date 컬럼이 A열
      dateColumnType: "text",   // date를 텍스트(YYYY-MM-DD)로 쓰는 것을 권장
      swipeThresholdPx: 40,
      lazyRootMargin: "200px"
    };

    /* =========================
      DOM
    ========================= */
    function $(sel, root){ return (root || document).querySelector(sel); }

    var els = {
      headerDate: $("#headerDate"),

      todayCarouselMount: $("#todayCarouselMount"),
      todayTitle: $("#todayTitle"),
      todayEmpty: $("#todayEmpty"),
      shareBtn: $("#shareBtn"),

      archiveToggle: $("#archiveToggle"),
      archiveChev: $("#archiveChev"),
      archivePanel: $("#archivePanel"),
      archiveRange: $("#archiveRange"),
      archiveList: $("#archiveList"),
      archiveEmpty: $("#archiveEmpty"),
      archiveError: $("#archiveError"),

      modal: $("#modal"),
      modalOverlay: $("#modalOverlay"),
      modalClose: $("#modalClose"),
      modalDate: $("#modalDate"),
      modalTitle: $("#modalTitle"),
      modalCarouselMount: $("#modalCarouselMount"),
      modalCounter: $("#modalCounter"),

      toast: $("#toast")
    };

    var state = {
      todayStr: "",
      todayItem: null,
      archiveItems: [],
      modalOpen: false,
      scrollY: 0
    };

    /* =========================
      날짜 유틸 (KST 고정: UTC+9)
    ========================= */
    function pad2(n){ return String(n).padStart(2, "0"); }

    function formatUTCDateToYYYYMMDD(dt){
      var y = dt.getUTCFullYear();
      var m = pad2(dt.getUTCMonth() + 1);
      var d = pad2(dt.getUTCDate());
      return y + "-" + m + "-" + d;
    }

    function getTodayKSTString(){
      var now = new Date();
      var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      var kstMs = utcMs + (9 * 60 * 60000);
      var kst = new Date(kstMs);
      return formatUTCDateToYYYYMMDD(kst);
    }

    function shiftDateString(baseYYYYMMDD, deltaDays){
      var m = String(baseYYYYMMDD).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return baseYYYYMMDD;
      var y = Number(m[1]);
      var mo = Number(m[2]);
      var d = Number(m[3]);

      var dt = new Date(Date.UTC(y, mo - 1, d));
      dt.setUTCDate(dt.getUTCDate() + deltaDays);
      return formatUTCDateToYYYYMMDD(dt);
    }

    function formatDateKorean(dateStr){
      var m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return dateStr;
      return m[1] + "." + m[2] + "." + m[3];
    }

    /* =========================
      Toast
    ========================= */
    var toastTimer = null;
    function showToast(msg){
      if (!els.toast) return;
      els.toast.textContent = msg || "";
      els.toast.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){
        els.toast.classList.remove("is-show");
      }, 1500);
    }

    /* =========================
      Lazy Loading (IntersectionObserver)
    ========================= */
    var imgObserver = null;

    function initLazyObserver(){
      if (imgObserver) return;
      if (!("IntersectionObserver" in window)) return;

      imgObserver = new IntersectionObserver(function(entries){
        for (var i=0; i<entries.length; i++){
          var entry = entries[i];
          if (!entry.isIntersecting) continue;
          var img = entry.target;
          loadImgNow(img);
          imgObserver.unobserve(img);
        }
      }, { root:null, rootMargin: CONFIG.lazyRootMargin, threshold:0.01 });
    }

    function observeLazyImgs(rootEl){
      if (!rootEl) return;
      var imgs = rootEl.querySelectorAll("img[data-src]");
      if (!imgs || !imgs.length) return;

      // 구형 fallback: IO 없으면 즉시 로드
      if (!("IntersectionObserver" in window)) {
        for (var i=0; i<imgs.length; i++) loadImgNow(imgs[i]);
        return;
      }

      initLazyObserver();
      for (var j=0; j<imgs.length; j++) imgObserver.observe(imgs[j]);
    }

    function loadImgNow(img){
      if (!img) return;
      var src = img.getAttribute("data-src");
      if (!src) return;
      if (img.getAttribute("data-loaded") === "1") return;

      img.setAttribute("data-loaded", "1");
      img.src = src;

      var box = closest(img, ".img-box");
      if (box) box.classList.add("is-loading");

      img.addEventListener("load", function(){
        if (box) {
          box.classList.remove("is-loading");
          box.classList.add("is-loaded");
        }
      }, { once:true });

      img.addEventListener("error", function(){
        if (box) {
          box.classList.remove("is-loading");
          box.classList.add("is-error");
        }
      }, { once:true });
    }

    function ensureImgLoaded(img){
      if (!img) return;
      if (img.getAttribute("data-src") && img.getAttribute("data-loaded") !== "1") {
        loadImgNow(img);
      }
    }

    function closest(el, selector){
      if (!el) return null;
      if (el.closest) return el.closest(selector);
      while (el) {
        if (matches(el, selector)) return el;
        el = el.parentElement;
      }
      return null;
    }

    function matches(el, selector){
      if (!el) return false;
      var p = Element.prototype;
      var f = p.matches || p.webkitMatchesSelector || p.msMatchesSelector;
      if (f) return f.call(el, selector);
      return false;
    }

    /* =========================
      Google Sheets (gviz) Fetch + Parsing
    ========================= */
    function buildGvizUrl(baseUrl, query){
      try {
        var u = new URL(baseUrl);
        u.searchParams.set("tqx", "out:json");
        if (query) u.searchParams.set("tq", query);
        return u.toString();
      } catch (e) {
        var url = String(baseUrl || "");
        var hasQ = url.indexOf("?") >= 0;

        if (!/[\?&]tqx=/.test(url)) {
          url += (hasQ ? "&" : "?") + "tqx=out:json";
          hasQ = true;
        }
        if (query) url += (hasQ ? "&" : "?") + "tq=" + encodeURIComponent(query);
        return url;
      }
    }

    function buildQuerySince(startDateStr){
      var A = CONFIG.queryDateColumn;
      var literal = (CONFIG.dateColumnType === "date")
        ? ("date '" + startDateStr + "'")
        : ("'" + startDateStr + "'");

      // date(A), title(B), img1(C)~img6(H)
      return "select A,B,C,D,E,F,G,H where " + A + " >= " + literal + " order by " + A + " desc";
    }

    function fetchText(url){
      if (typeof window.fetch === "function") {
        return fetch(url, { method:"GET", credentials:"omit" }).then(function(res){
          if (!res.ok) throw new Error("시트 데이터를 불러오지 못했습니다. (HTTP " + res.status + ")");
          return res.text();
        });
      }

      return new Promise(function(resolve, reject){
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function(){
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
          else reject(new Error("시트 데이터를 불러오지 못했습니다. (HTTP " + xhr.status + ")"));
        };
        xhr.onerror = function(){ reject(new Error("네트워크 오류로 시트 데이터를 불러오지 못했습니다.")); };
        xhr.send();
      });
    }

    function extractGvizObjectString(text){
      var m = String(text).match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\)\s*;?\s*$/);
      if (!m) throw new Error("gviz 응답 형식이 예상과 다릅니다.");
      return m[1];
    }

    function parseGviz(text){
      var objStr = extractGvizObjectString(text);
      try {
        return JSON.parse(objStr);
      } catch (e) {
        try {
          // date 타입 등으로 JSON.parse 실패할 때 fallback
          // eslint-disable-next-line no-new-func
          return (new Function("return (" + objStr + ");"))();
        } catch (e2) {
          throw new Error("gviz 파싱 실패: date 컬럼은 텍스트(YYYY-MM-DD) 권장입니다.");
        }
      }
    }

    function normalizeDateCell(val){
      if (!val) return "";

      if (val instanceof Date) {
        var y = val.getFullYear();
        var m = pad2(val.getMonth() + 1);
        var d = pad2(val.getDate());
        return y + "-" + m + "-" + d;
      }

      var s = String(val).trim();

      var dm = s.match(/^Date\((\d+),\s*(\d+),\s*(\d+)\)$/);
      if (dm) {
        var yy = Number(dm[1]);
        var mo = pad2(Number(dm[2]) + 1);
        var dd = pad2(Number(dm[3]));
        return yy + "-" + mo + "-" + dd;
      }

      var iso = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
      if (iso) return iso[1] + "-" + pad2(iso[2]) + "-" + pad2(iso[3]);

      return s;
    }

    function toItemListFromGviz(gviz){
      if (!gviz || !gviz.table || !Array.isArray(gviz.table.rows)) return [];

      var cols = gviz.table.cols || [];
      var labelToIdx = {};
      for (var i=0; i<cols.length; i++){
        var c = cols[i] || {};
        var label = (c.label != null) ? String(c.label).trim().toLowerCase() : "";
        if (label) labelToIdx[label] = i;
      }

      var idxDate  = (typeof labelToIdx["date"]  === "number") ? labelToIdx["date"]  : 0;
      var idxTitle = (typeof labelToIdx["title"] === "number") ? labelToIdx["title"] : 1;

      // img1~img6
      var imgIdxs = [];
      for (var k=1; k<=6; k++){
        var key = "img" + k;
        var idx = labelToIdx[key];
        if (typeof idx !== "number") idx = 1 + k; // img1=2 ... img6=7
        imgIdxs.push(idx);
      }

      var items = [];
      var rows = gviz.table.rows;

      for (var r=0; r<rows.length; r++){
        var row = rows[r] || {};
        var cells = row.c || [];

        function getV(idx){
          return (cells[idx] && typeof cells[idx].v !== "undefined") ? cells[idx].v : "";
        }

        var date = normalizeDateCell(getV(idxDate));
        var title = String(getV(idxTitle) || "").trim();

        var images = [];
        for (var j=0; j<imgIdxs.length; j++){
          var v = String(getV(imgIdxs[j]) || "").trim();
          if (v) images.push(v);
        }

        // cardnews 최소 조건: date + images(최소 1장)
        if (!date) continue;
        if (!images.length) continue;

        items.push({ date: date, title: title, images: images });
      }

      // 날짜 역순
      items.sort(function(a,b){
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
      });

      return items;
    }

    function fetchItemsSince(startDateStr){
      if (!SHEETS_JSON_URL) return Promise.reject(new Error("SHEETS_JSON_URL이 비어 있습니다."));
      var query = buildQuerySince(startDateStr);
      var url = buildGvizUrl(SHEETS_JSON_URL, query);

      return fetchText(url).then(function(text){
        var gviz = parseGviz(text);

        if (gviz.status && gviz.status === "error") {
          var msg = "시트 응답이 에러입니다.";
          if (gviz.errors && gviz.errors[0]) {
            msg = gviz.errors[0].detailed_message || gviz.errors[0].message || msg;
          }
          throw new Error(msg);
        }

        return toItemListFromGviz(gviz);
      });
    }

    /* =========================
      XSS-safe 출력
    ========================= */
    function escapeHtml(str){
      return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }
    function escapeHtmlAttr(str){
      return escapeHtml(String(str)).replace(/\n/g," ");
    }

    /* =========================
      이미지 박스 생성
    ========================= */
    function createImgBox(src, alt){
      var box = document.createElement("div");
      box.className = "img-box";
      box.innerHTML =
        '<img loading="lazy" decoding="async" data-src="' + escapeHtmlAttr(src) + '" alt="' + escapeHtmlAttr(alt || "") + '">' +
        '<span class="img-error-text">이미지를 불러올 수 없어요</span>';
      return box;
    }

    /* =========================
      캐러셀 (touch + mouse drag)
      ✅ 요구사항:
      - createCarousel 내부에서 measure/goTo(0) 호출 금지
      - 반환 객체에 init() 제공
      - appendChild 직후 carousel.init() 호출
    ========================= */

    // passive 이벤트 지원 여부 감지 (카카오 인앱/구형 대비)
    var supportsPassive = false;
    try {
      window.addEventListener("test", null, Object.defineProperty({}, "passive", {
        get: function(){ supportsPassive = true; }
      }));
    } catch (e) {}

    function createCarousel(images, mode, onIndexChange){
      var root = document.createElement("div");
      root.className = "carousel";

      var viewport = document.createElement("div");
      viewport.className = "carousel-viewport";

      var track = document.createElement("div");
      track.className = "carousel-track";

      var dots = document.createElement("div");
      dots.className = "dots";
      dots.hidden = !images || images.length <= 1;

      var imgList = (images && images.length) ? images.slice() : [""];

      for (var i=0; i<imgList.length; i++){
        var src = imgList[i];

        var slide = document.createElement("div");
        slide.className = "slide";

        if (src) slide.appendChild(createImgBox(src, (mode === "modal" ? "카드뉴스" : "오늘의 카드뉴스") + " " + (i+1)));
        else {
          var ph = document.createElement("div");
          ph.className = "img-box is-error";
          ph.innerHTML = '<span class="img-error-text">이미지가 없습니다</span>';
          slide.appendChild(ph);
        }

        track.appendChild(slide);

        var dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("aria-hidden", "true");
        dots.appendChild(dot);
      }

      viewport.appendChild(track);
      root.appendChild(viewport);
      root.appendChild(dots);

      var idx = 0;
      var width = 1;

      function measure(){
        var w = viewport.getBoundingClientRect().width;
        if (!w || w < 2) w = viewport.offsetWidth;
        width = (w && w >= 2) ? w : 1;
        applyTransform(false);
      }

      function applyTransform(withAnim){
        if (withAnim === void 0) withAnim = true;

        track.style.transition = withAnim ? "transform 220ms ease" : "none";
        track.style.transform = "translate3d(" + (-idx * width) + "px, 0, 0)";

        var dotEls = dots.querySelectorAll(".dot");
        for (var i=0; i<dotEls.length; i++){
          dotEls[i].classList.toggle("active", i === idx);
        }

        // 현재/이웃 슬라이드 이미지는 즉시 로드(Observer 누락 대비)
        var slides = track.children;
        var cur  = slides[idx]     && slides[idx].querySelector("img[data-src]");
        var prev = slides[idx - 1] && slides[idx - 1].querySelector("img[data-src]");
        var next = slides[idx + 1] && slides[idx + 1].querySelector("img[data-src]");
        ensureImgLoaded(cur);
        ensureImgLoaded(prev);
        ensureImgLoaded(next);

        if (typeof onIndexChange === "function") onIndexChange(idx, imgList.length);
      }

      function clampIndex(n){
        var max = Math.max(0, imgList.length - 1);
        if (n < 0) return 0;
        if (n > max) return max;
        return n;
      }

      function goTo(n, withAnim){
        if (withAnim === void 0) withAnim = true;
        idx = clampIndex(n);
        applyTransform(withAnim);
      }

      /* Touch swipe */
      var startX=0, startY=0;
      var dragging=false;
      var dragDx=0;
      var isHorizontal=null;

      function onTouchStart(e){
        if (!e.touches || e.touches.length !== 1) return;
        dragging = true;
        isHorizontal = null;
        dragDx = 0;

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        track.style.transition = "none";
      }

      function onTouchMove(e){
        if (!dragging || !e.touches || e.touches.length !== 1) return;

        var x = e.touches[0].clientX;
        var y = e.touches[0].clientY;
        var dx = x - startX;
        var dy = y - startY;

        if (isHorizontal === null) isHorizontal = Math.abs(dx) > Math.abs(dy);

        if (!isHorizontal) {
          dragging = false;
          track.style.transition = "transform 220ms ease";
          applyTransform(true);
          return;
        }

        e.preventDefault();
        dragDx = dx;
        track.style.transform = "translate3d(" + ((-idx * width) + dx) + "px, 0, 0)";
      }

      function onTouchEnd(){
        if (!dragging) return;
        dragging = false;

        if (Math.abs(dragDx) >= CONFIG.swipeThresholdPx) {
          if (dragDx < 0) goTo(idx + 1, true);
          else goTo(idx - 1, true);
        } else {
          goTo(idx, true);
        }
        dragDx = 0;
      }

      /* Mouse drag (PC) */
      var mStartX=0, mStartY=0;
      var mDragging=false;
      var mDragDx=0;
      var mIsHorizontal=null;

      function detachMouse(){
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        window.removeEventListener("mouseleave", onMouseUp);
      }

      function onMouseDown(e){
        if (e.button !== 0) return;
        mDragging = true;
        mIsHorizontal = null;
        mDragDx = 0;

        mStartX = e.clientX;
        mStartY = e.clientY;
        track.style.transition = "none";
        e.preventDefault();

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
        window.addEventListener("mouseleave", onMouseUp);
      }

      function onMouseMove(e){
        if (!mDragging) return;

        var dx = e.clientX - mStartX;
        var dy = e.clientY - mStartY;

        if (mIsHorizontal === null) mIsHorizontal = Math.abs(dx) > Math.abs(dy);

        if (!mIsHorizontal) {
          mDragging = false;
          detachMouse();
          track.style.transition = "transform 220ms ease";
          applyTransform(true);
          return;
        }

        e.preventDefault();
        mDragDx = dx;
        track.style.transform = "translate3d(" + ((-idx * width) + dx) + "px, 0, 0)";
      }

      function onMouseUp(){
        if (!mDragging) return;
        mDragging = false;
        detachMouse();

        if (Math.abs(mDragDx) >= CONFIG.swipeThresholdPx) {
          if (mDragDx < 0) goTo(idx + 1, true);
          else goTo(idx - 1, true);
        } else {
          goTo(idx, true);
        }
        mDragDx = 0;
      }

      // 이벤트 등록 (passive 대응)
      viewport.addEventListener("touchstart", onTouchStart, supportsPassive ? { passive:true } : false);
      viewport.addEventListener("touchmove",  onTouchMove,  supportsPassive ? { passive:false } : false);
      viewport.addEventListener("touchend",   onTouchEnd,   supportsPassive ? { passive:true } : false);
      viewport.addEventListener("touchcancel",onTouchEnd,   supportsPassive ? { passive:true } : false);

      viewport.addEventListener("mousedown", onMouseDown);
      viewport.addEventListener("dragstart", function(e){ e.preventDefault(); });

      window.addEventListener("resize", function(){ measure(); }, supportsPassive ? { passive:true } : false);

      // ✅ 요구사항: appendChild 후 init()에서 measure/goTo(0,false)
      function init(){
        idx = 0;
        measure();
        goTo(0, false);
        observeLazyImgs(root);

        // 혹시 width가 아직 1로 남으면 다음 프레임에 한 번 더 측정(안정성)
        if (width <= 1) {
          requestAnimationFrame(function(){
            measure();
            goTo(0, false);
          });
        }
      }

      return { el: root, init: init, goTo: goTo };
    }

    /* =========================
      공유하기 (Web Share API → 미지원 시 URL 복사)
    ========================= */
    function copyToClipboard(text){
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }

      return new Promise(function(resolve, reject){
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          ta.style.top = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (ok) resolve();
          else reject(new Error("copy failed"));
        } catch (e) {
          reject(e);
        }
      });
    }

    function shareToday(){
      var url = window.location.href;
      var title = "염광사 일간 뉴스";
      var text = state.todayItem && state.todayItem.title ? state.todayItem.title : "오늘의 카드뉴스";

      if (navigator.share) {
        navigator.share({ title: title, text: text, url: url }).catch(function(){});
        return;
      }

      copyToClipboard(url).then(function(){
        showToast("링크가 복사되었습니다");
      }).catch(function(){
        showToast("복사에 실패했어요. 주소를 직접 복사해주세요");
      });
    }

    /* =========================
      Modal
    ========================= */
    function lockBodyScroll(){
      state.scrollY = window.scrollY || 0;
      document.body.classList.add("is-locked");
      document.body.style.top = "-" + state.scrollY + "px";
    }

    function unlockBodyScroll(){
      document.body.classList.remove("is-locked");
      document.body.style.top = "";
      window.scrollTo(0, state.scrollY);
    }

    function openModal(item){
      if (!item) return;
      state.modalOpen = true;

      els.modalDate.textContent = formatDateKorean(item.date);
      els.modalTitle.textContent = item.title || "";

      els.modalCarouselMount.innerHTML = "";
      var total = Math.max(1, (item.images || []).length);
      els.modalCounter.textContent = "1 / " + total;

      var carousel = createCarousel(item.images || [], "modal", function(i, total){
        els.modalCounter.textContent = (i + 1) + " / " + total;
      });

      els.modalCarouselMount.appendChild(carousel.el);

      els.modal.classList.add("is-open");
      els.modal.setAttribute("aria-hidden", "false");
      lockBodyScroll();

      carousel.init();

      // 안드로이드 뒤로가기로 모달만 닫히게
      try { history.pushState({ modal:true }, ""); } catch (e) {}
    }

    function closeModal(fromPopState){
      if (!state.modalOpen) return;
      state.modalOpen = false;

      els.modal.classList.remove("is-open");
      els.modal.setAttribute("aria-hidden", "true");
      els.modalCarouselMount.innerHTML = "";
      unlockBodyScroll();

      if (!fromPopState) {
        try { history.back(); } catch (e) {}
      }
    }

    els.modalOverlay.addEventListener("click", function(){ closeModal(false); });
    els.modalClose.addEventListener("click", function(){ closeModal(false); });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeModal(false);
    });
    window.addEventListener("popstate", function(){
      if (state.modalOpen) closeModal(true);
    });

    /* =========================
      Render
    ========================= */
    function setError(msg){
      els.archiveError.textContent = msg || "";
      els.archiveError.hidden = !msg;
    }

    function renderToday(todayItem){
      els.todayCarouselMount.innerHTML = "";
      els.todayTitle.textContent = "";
      els.todayEmpty.hidden = true;
      els.shareBtn.hidden = true;

      state.todayItem = todayItem || null;

      if (!todayItem || !todayItem.images || !todayItem.images.length) {
        els.todayEmpty.hidden = false;
        return;
      }

      var carousel = createCarousel(todayItem.images, "today", function(){});
      els.todayCarouselMount.appendChild(carousel.el);
      carousel.init();

      els.todayTitle.textContent = todayItem.title || "";
      els.shareBtn.hidden = false;
    }

    function renderArchive(items, startStr, endStr){
      els.archiveList.innerHTML = "";
      els.archiveEmpty.hidden = true;

      if (!items || !items.length) {
        els.archiveEmpty.hidden = false;
        return;
      }

      // 최신(어제) → 과거(D-7) 순
      var sorted = items.slice().sort(function(a,b){
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
      });

      for (var i=0; i<sorted.length; i++){
        (function(item){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "news-item";
          btn.setAttribute("aria-label", item.date + " " + (item.title || "") + " 상세 보기");

          var thumb = document.createElement("div");
          thumb.className = "thumb";
          thumb.appendChild(createImgBox(item.images[0], item.date + " 썸네일"));

          var meta = document.createElement("div");
          meta.className = "news-meta";
          meta.innerHTML =
            '<div class="news-date">' + escapeHtml(formatDateKorean(item.date)) + '</div>' +
            '<div class="news-title">' + escapeHtml(item.title || "") + '</div>';

          btn.appendChild(thumb);
          btn.appendChild(meta);

          btn.addEventListener("click", function(){
            openModal(item);
          });

          els.archiveList.appendChild(btn);
        })(sorted[i]);
      }

      // 접힌 상태에서는 로드 안 되다가, 펼치면 IO가 로드하게 함(관측은 미리 걸어둠)
      observeLazyImgs(els.archiveList);
    }

    /* =========================
      Accordion toggle
    ========================= */
    function setArchiveOpen(open){
      els.archivePanel.hidden = !open;
      els.archiveToggle.setAttribute("aria-expanded", open ? "true" : "false");
      els.archiveChev.textContent = open ? "▲" : "▼";

      if (open) {
        // 펼칠 때 근처 이미지 즉시 관측/로드
        observeLazyImgs(els.archivePanel);
      }
    }

    els.archiveToggle.addEventListener("click", function(){
      var isOpen = els.archiveToggle.getAttribute("aria-expanded") === "true";
      setArchiveOpen(!isOpen);
    });

    /* =========================
      Init
    ========================= */
    (function init(){
      // 헤더 날짜
      state.todayStr = getTodayKSTString();
      els.headerDate.textContent = formatDateKorean(state.todayStr);

      // “지난 뉴스” 범위: D-7 ~ D-1
      var start = shiftDateString(state.todayStr, -CONFIG.archiveDays); // D-7
      var endArchive = shiftDateString(state.todayStr, -1);             // D-1

      els.archiveRange.textContent = formatDateKorean(start) + " ~ " + formatDateKorean(endArchive);

      // 기본은 접힘
      setArchiveOpen(false);

      // 공유 버튼
      els.shareBtn.addEventListener("click", function(){
        shareToday();
      });

      // 초기 로드: D-7 ~ D (8일치가 필요)
      setError("");
      fetchItemsSince(start).then(function(raw){
        var end = state.todayStr; // D까지 포함해서 가져온 뒤 분리
        var ranged = raw.filter(function(it){
          return it.date >= start && it.date <= end;
        });

        // 오늘
        var todayItem = null;
        for (var i=0; i<ranged.length; i++){
          if (ranged[i].date === state.todayStr) {
            todayItem = ranged[i];
            break;
          }
        }

        // 아카이브: D-7..D-1 (오늘 제외)
        var archiveItems = ranged.filter(function(it){
          return it.date >= start && it.date <= endArchive;
        });

        state.archiveItems = archiveItems;

        renderToday(todayItem);
        renderArchive(archiveItems, start, endArchive);

      }).catch(function(e){
        renderToday(null);
        els.archiveEmpty.hidden = false;
        setError(e && e.message ? e.message : "데이터를 불러오지 못했습니다.");
      });
    })();
  </script>
