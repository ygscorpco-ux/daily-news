<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4797" />
  <title>염광사 일간 뉴스</title>

  <style>
    :root{
      --brand:#1b4797;
      --bg:#ffffff;
      --text:#111;
      --sub:#666;
      --muted:#999;
      --line:#eee;
      --placeholder:#f2f2f2;
      --radius:10px;
      --maxw:520px;
      --padX:16px;
      --padY:14px;
      --shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    button, a { -webkit-tap-highlight-color: transparent; }

    /* ═══ Header ═══ */
    .app-header{
      position: sticky;
      top:0;
      z-index:50;
      background:var(--brand);
      color:#fff;
      padding-top: env(safe-area-inset-top);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header-inner{
      height:48px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 var(--padX);
      transition: height 200ms ease;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex:1;
    }
    .header-logo{
      height:48px;
      width:auto;
      object-fit: contain;
      display:block;
      flex-shrink:0;
      transition: height 200ms ease;
    }
    .header-title{
      font-weight:900;
      font-size:16px;
      letter-spacing:-0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
      transition: font-size 200ms ease;
    }
    .header-date{
      font-weight:800;
      font-size:13px;
      opacity:0.95;
      white-space:nowrap;
      flex-shrink:0;
      transition: font-size 200ms ease;
    }
    .app-header.is-compact .header-inner{ height:36px; }
    .app-header.is-compact .header-title{ font-size:14px; }
    .app-header.is-compact .header-date{ font-size:12px; }
    .app-header.is-compact .header-logo{ height:36px; }

    /* ═══ Layout ═══ */
    .app{
      max-width:var(--maxw);
      margin:0 auto;
      padding: var(--padY) var(--padX);
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }
    .section-title{
      font-size:13px;
      font-weight:900;
      color:var(--text);
      letter-spacing:-0.2px;
      margin:0 0 10px;
    }
    .empty-msg{
      padding:16px 0;
      text-align:center;
      color:#777;
      font-size:13px;
      font-weight:800;
    }
    .error-msg{
      margin-top:10px;
      padding:12px;
      border-radius:10px;
      background:#fff5f5;
      color:#c92a2a;
      font-size:12px;
      font-weight:800;
      line-height:1.45;
    }

    /* ═══ Hero (오늘의 카드뉴스) ═══ */
    .hero-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .hero-bleed{
      position:relative;
      width:100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }
    .share-btn{
      position:absolute;
      right:12px;
      bottom:12px;
      border:1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.25);
      color:#fff;
      font-weight:900;
      font-size:12px;
      padding:10px 12px;
      border-radius:999px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      cursor:pointer;
      backdrop-filter: blur(6px);
      z-index: 6;
    }
    .share-btn:active{ transform: translateY(1px); }
    .today-title{
      position:absolute;
      left:16px;
      right:84px;
      bottom:38px;
      color:#fff;
      font-weight:900;
      font-size:16px;
      line-height:1.22;
      letter-spacing:-0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      z-index: 6;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      pointer-events:none;
    }

    /* ═══ Carousel ═══ */
    .carousel{
      width:100%;
      user-select:none;
      position: relative;
    }
    .carousel-viewport{
      overflow:hidden;
      border-radius: var(--radius);
      background: var(--placeholder);
      touch-action: pan-y;
      position: relative;
    }
    .carousel-track{
      display:flex;
      will-change: transform;
    }
    .slide{ flex: 0 0 100%; padding:0; }
    .img-box{
      position:relative;
      width:100%;
      padding-top:100%;
      background: var(--placeholder);
      border-radius: var(--radius);
      overflow:hidden;
    }
    .img-box img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      opacity:0;
      transition: opacity 180ms ease;
      display:block;
    }
    .img-box.is-loaded img{ opacity:1; }
    .img-error-text{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:10px;
      text-align:center;
      color:#777;
      font-size:12px;
      font-weight:900;
      line-height:1.35;
    }
    .img-box.is-error .img-error-text{ display:flex; }
    #todayBleed .carousel-viewport{ border-radius: 0; }
    #todayBleed .img-box{ border-radius: 0; }
    #todayBleed .carousel-viewport::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height:30%;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 100%);
      pointer-events:none;
      z-index: 3;
    }

    /* ═══ Dots ═══ */
    .dots{
      display:flex;
      justify-content:center;
      gap:6px;
      margin-top:0;
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      bottom:14px;
      z-index: 6;
      pointer-events:none;
    }
    .dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background: rgba(255,255,255,0.5);
      transition: width 160ms ease, background 160ms ease;
    }
    .dot.active{
      width:16px;
      height:6px;
      border-radius:999px;
      background:#fff;
    }
    .modal .dots{ display:none !important; }

    /* ═══ Archive ═══ */
    .archive{
      margin-top:18px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .archive-toggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border:0;
      border-radius:14px;
      background: rgba(27,71,151,0.08);
      cursor:pointer;
      font-weight:900;
      font-size:14px;
      letter-spacing:-0.2px;
      color:var(--text);
    }
    .archive-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }
    .archive-icon{ font-size:16px; line-height:1; }
    .archive-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .archive-right{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }
    .archive-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:4px 8px;
      border-radius:999px;
      background:#1b4797;
      color:#fff;
      font-size:11px;
      font-weight:900;
      line-height:1;
      min-width: 40px;
    }
    .archive-chev{ font-weight:900; opacity:0.9; }
    .archive-range{
      margin:10px 2px 8px;
      font-size:12px;
      font-weight:800;
      color:var(--sub);
      white-space:nowrap;
    }
    .archive-panel{ margin-top:10px; }
    .archive-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* ═══ Archive Item ═══ */
    .news-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 12px;
      border:0;
      border-radius:14px;
      background:#fff;
      cursor:pointer;
      text-align:left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .news-item:active{ transform: translateY(1px); }
    .thumb{ width:64px; flex: 0 0 64px; }
    .thumb .img-box{ padding-top:100%; border-radius:12px; }
    .news-meta{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .news-date{ font-size:12px; font-weight:900; color:var(--sub); white-space:nowrap; }
    .news-title{
      font-size:13px;
      font-weight:900;
      color:var(--text);
      line-height:1.25;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      word-break:break-word;
    }

    /* ═══ Modal ═══ */
    .modal{
      position:fixed;
      inset:0;
      display:none;
      z-index:100;
    }
    .modal.is-open{ display:block; }
    .modal-overlay{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.7);
    }
    .modal-panel{
      position:absolute;
      left:0; right:0; top:0; bottom:0;
      background:#fff;
      border-radius:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:none;
    }
    .modal-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top:0;
      z-index: 20;
    }
    .modal-meta{ min-width:0; flex:1; }
    .modal-date{ font-size:12px; color:var(--sub); font-weight:900; margin-bottom:4px; }
    .modal-title{
      font-size:14px;
      font-weight:900;
      color:var(--text);
      line-height:1.25;
      word-break:break-word;
    }
    .modal-close{
      border:0;
      background:transparent;
      font-size:20px;
      font-weight:900;
      color:#333;
      line-height:1;
      padding:6px 8px;
      cursor:pointer;
    }
    .modal-body{
      padding:12px 14px calc(14px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .modal-carousel-wrap{ position: relative; }
    .nav-arrow{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.25);
      color:#fff;
      font-size:20px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .nav-arrow.prev{ left:10px; }
    .nav-arrow.next{ right:10px; }
    .nav-arrow:active{ transform: translateY(-50%) scale(0.98); }
    .modal-counter{
      text-align:center;
      font-size:13px;
      color:#555;
      font-weight:900;
    }

    /* ═══ Scroll lock ═══ */
    body.is-locked{
      position:fixed;
      left:0; right:0;
      width:100%;
      overflow:hidden;
    }

    /* ═══ Toast ═══ */
    .toast{
      position:fixed;
      left:50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(0,0,0,0.78);
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      opacity:0;
      pointer-events:none;
      transition: opacity 160ms ease;
      z-index:200;
      max-width: calc(100% - 24px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.is-show{ opacity:1; }

    .bottom-pad{ height: 10px; }

    /* ══════════════════════════════════════
       투표 피드백 시스템
       ══════════════════════════════════════ */

    /* ── 투표 전체 래퍼 ── */
    .vote-section{
      padding: 20px var(--padX) 8px;
    }
    .hero-bleed .vote-section{
      padding: 18px 20px 10px;
    }

    /* ── 안내 멘트 ── */
    .vote-prompt{
      text-align:center;
      margin-bottom:14px;
    }
    .vote-prompt-main{
      font-size:13px;
      font-weight:800;
      color:var(--text);
      line-height:1.5;
      letter-spacing:-0.2px;
    }
    .vote-prompt-sub{
      font-size:11px;
      font-weight:600;
      color:var(--muted);
      margin-top:4px;
      line-height:1.45;
    }

    /* ── 버튼 행 ── */
    .vote-row{
      display:flex;
      justify-content:center;
      gap:12px;
    }

    /* ── 개별 버튼 ── */
    .vote-btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:10px 22px;
      border:1.5px solid var(--line);
      border-radius:999px;
      background:var(--bg);
      color:var(--sub);
      font-size:13px;
      font-weight:800;
      letter-spacing:-0.15px;
      cursor:pointer;
      transition: all 220ms cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      overflow:hidden;
    }
    .vote-btn::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:999px;
      opacity:0;
      transition: opacity 280ms ease;
      pointer-events:none;
    }
    .vote-btn:active{
      transform:scale(0.94);
    }

    /* 이모지 아이콘 */
    .vote-emoji{
      font-size:18px;
      line-height:1;
      transition: transform 280ms cubic-bezier(.34,1.56,.64,1);
    }
    .vote-btn:active .vote-emoji{
      transform:scale(1.25);
    }

    /* 카운트 */
    .vote-count{
      font-size:12px;
      font-weight:900;
      color:var(--muted);
      min-width:8px;
      text-align:center;
      transition: color 220ms ease;
    }

    /* ── 좋아요 투표 완료 ── */
    .vote-btn.is-voted-good{
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(27,71,151,0.04);
      box-shadow: 0 0 0 3px rgba(27,71,151,0.08);
    }
    .vote-btn.is-voted-good::before{
      background: radial-gradient(circle, rgba(27,71,151,0.06) 0%, transparent 70%);
      opacity:1;
    }
    .vote-btn.is-voted-good .vote-emoji{
      transform:scale(1.15);
    }
    .vote-btn.is-voted-good .vote-count{
      color:var(--brand);
    }

    /* ── 별로에요 투표 완료 ── */
    .vote-btn.is-voted-bad{
      border-color: #aaa;
      color: #777;
      background: rgba(0,0,0,0.02);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.03);
    }
    .vote-btn.is-voted-bad::before{
      background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
      opacity:1;
    }
    .vote-btn.is-voted-bad .vote-count{
      color:#999;
    }

    /* ── 비활성 (투표 후 반대쪽) ── */
    .vote-btn.is-disabled{
      opacity:0.4;
      pointer-events:none;
    }

    /* ── 팝 애니메이션 (투표 시) ── */
    @keyframes votePop{
      0%{ transform:scale(1); }
      35%{ transform:scale(1.12); }
      70%{ transform:scale(0.95); }
      100%{ transform:scale(1); }
    }
    .vote-btn.is-popping{
      animation: votePop 360ms cubic-bezier(.34,1.56,.64,1);
    }

    /* ── 하트 파티클 (좋아요 시) ── */
    @keyframes floatUp{
      0%{ opacity:1; transform:translateY(0) scale(1); }
      100%{ opacity:0; transform:translateY(-38px) scale(0.5); }
    }
    .vote-particle{
      position:absolute;
      top:-4px;
      font-size:14px;
      pointer-events:none;
      z-index:10;
      animation: floatUp 700ms cubic-bezier(.4,0,.2,1) forwards;
    }

    /* ── 감사 메시지 (투표 후 안내 멘트 대체) ── */
    .vote-thanks{
      text-align:center;
      padding:2px 0 0;
    }
    .vote-thanks-text{
      font-size:12px;
      font-weight:700;
      color:var(--brand);
      line-height:1.5;
      opacity:0;
      transform:translateY(6px);
      transition: opacity 350ms ease, transform 350ms ease;
    }
    .vote-thanks-text.is-visible{
      opacity:1;
      transform:translateY(0);
    }

    /* ── 모달 내 투표 ── */
    .modal .vote-section{
      padding:16px 0 4px;
      border-top:1px solid var(--line);
      margin-top:6px;
    }
    .modal .vote-prompt-main{ font-size:12.5px; }
    .modal .vote-prompt-sub{ font-size:10.5px; }
    .modal .vote-btn{ padding:9px 18px; font-size:12.5px; }
    .modal .vote-emoji{ font-size:16px; }
  </style>
</head>

<body>
  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <div class="header-left">
        <img class="header-logo" src="https://cdn.imweb.me/upload/S2026011101dec1a0a9ee1/c71abe68efa9a.png" alt="염광사 로고" />
        <div class="header-title">염광사 일간 뉴스</div>
      </div>
      <div class="header-date" id="headerDate"></div>
    </div>
  </header>

  <main class="app">
    <section aria-label="오늘의 카드뉴스">
      <div class="hero-head">
        <h2 class="section-title" style="margin:0;">오늘의 카드뉴스</h2>
      </div>
      <div class="hero-bleed" id="todayBleed">
        <div id="todayCarouselMount"></div>
        <div id="todayTitle" class="today-title"></div>
        <button class="share-btn" id="shareBtn" type="button" hidden>공유하기</button>
      </div>
      <div class="empty-msg" id="todayEmpty" hidden>오늘의 뉴스가 준비 중입니다</div>
    </section>

    <section class="archive" aria-label="지난 뉴스">
      <button class="archive-toggle" id="archiveToggle" type="button" aria-expanded="false">
        <span class="archive-left">
          <span class="archive-icon" aria-hidden="true">📅</span>
          <span class="archive-label">지난 뉴스</span>
        </span>
        <span class="archive-right">
          <span class="archive-badge" id="archiveCountBadge">0건</span>
          <span id="archiveChev" class="archive-chev">▼</span>
        </span>
      </button>
      <div class="archive-panel" id="archivePanel" hidden>
        <div class="archive-range" id="archiveRange"></div>
        <div class="archive-list" id="archiveList"></div>
        <div class="empty-msg" id="archiveEmpty" hidden>표시할 뉴스가 없습니다</div>
        <div class="error-msg" id="archiveError" hidden></div>
      </div>
    </section>

    <div class="bottom-pad"></div>
  </main>

  <!-- 모달 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="카드뉴스 상세">
      <div class="modal-top">
        <div class="modal-meta">
          <div class="modal-date" id="modalDate"></div>
          <div class="modal-title" id="modalTitle"></div>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-carousel-wrap">
          <div id="modalCarouselMount"></div>
          <button class="nav-arrow prev" id="modalPrev" type="button" aria-label="이전" hidden>‹</button>
          <button class="nav-arrow next" id="modalNext" type="button" aria-label="다음" hidden>›</button>
        </div>
        <div class="modal-counter" id="modalCounter">0 / 0</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script>
    /* ══════════════════════════════════════
       염광사 일간 카드뉴스 + 투표 시스템
       ══════════════════════════════════════ */

    /* ═══ 관리자 설정 ═══ */
    var SHEETS_JSON_URL = "https://docs.google.com/spreadsheets/d/1a26j950Nn67Qj1yYIyuuoMd6MIpC8YCcUDG2pyZjRrc/gviz/tq?tqx=out:json";

    /* ═══ 날짜 유틸 ═══ */
    function pad2(n){ return String(n).padStart(2, "0"); }
    function formatUTCDateToYYYYMMDD(dt){
      return dt.getUTCFullYear() + "-" + pad2(dt.getUTCMonth()+1) + "-" + pad2(dt.getUTCDate());
    }
    function getTodayKSTString(){
      var now = new Date();
      var kst = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9*3600000));
      return formatUTCDateToYYYYMMDD(kst);
    }
    function shiftDateString(base, delta){
      var m = String(base).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return base;
      var dt = new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
      dt.setUTCDate(dt.getUTCDate()+delta);
      return formatUTCDateToYYYYMMDD(dt);
    }
    function formatDateKorean(s){
      var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? m[1]+"."+m[2]+"."+m[3] : s;
    }
    function getWeekdayKorean(s){
      var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return "";
      var dt=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
      return ["일","월","화","수","목","금","토"][dt.getUTCDay()]||"";
    }
    function formatDateKoreanWithWeekday(s){
      var b=formatDateKorean(s), w=getWeekdayKorean(s);
      return w ? b+" "+w : b;
    }
    function isValidISODateString(s){
      var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return false;
      var y=Number(m[1]), mo=Number(m[2]), d=Number(m[3]);
      var dt=new Date(Date.UTC(y,mo-1,d));
      return dt.getUTCFullYear()===y && (dt.getUTCMonth()+1)===mo && dt.getUTCDate()===d;
    }
    function toISODateStringLoose(val){
      if(!val) return "";
      if(val instanceof Date) return val.getFullYear()+"-"+pad2(val.getMonth()+1)+"-"+pad2(val.getDate());
      var s=String(val).trim();
      var dm=s.match(/^Date\((\d+),\s*(\d+),\s*(\d+)\)$/);
      if(dm) return Number(dm[1])+"-"+pad2(Number(dm[2])+1)+"-"+pad2(Number(dm[3]));
      var iso=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
      if(iso) return Number(iso[1])+"-"+pad2(Number(iso[2]))+"-"+pad2(Number(iso[3]));
      return s;
    }
    function normalizeImageSource(v){
      return String(v==null?"":v).trim();
    }
    function uniqueList(arr){
      var seen={},out=[];
      for(var i=0;i<arr.length;i++){
        var key=String(arr[i]||"");
        if(!key||seen[key]) continue;
        seen[key]=1;
        out.push(key);
      }
      return out;
    }
    function dedupeItemsByDate(items,warnings,label){
      var seen={},out=[];
      for(var i=0;i<items.length;i++){
        var it=items[i];
        if(seen[it.date]){
          if(Array.isArray(warnings)) warnings.push(label+" "+it.date+" 중복: 첫 번째 행만 사용합니다.");
          continue;
        }
        seen[it.date]=1;
        out.push(it);
      }
      return out;
    }

    /* ═══ Toast ═══ */
    var toastTimer = null;

      if(!els.toast) return;
      els.toast.textContent = msg||"";

      toastTimer = setTimeout(function(){ els.toast.classList.remove("is-show"); }, 1800);

    /* ═══ Lazy Loading ═══ */
    var imgObserver = null;
    function initLazyObserver(){
      if(imgObserver) return;
      if(!("IntersectionObserver" in window)) return;
      imgObserver = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(!entries[i].isIntersecting) continue;
          loadImgNow(entries[i].target);
          imgObserver.unobserve(entries[i].target);
        }
      },{ root:null, rootMargin:CONFIG.lazyRootMargin, threshold:0.01 });
    }
    function observeLazyImgs(root){
      if(!root) return;
      var imgs=root.querySelectorAll("img[data-src]");
      if(!imgs||!imgs.length) return;
      if(!("IntersectionObserver" in window)){
        for(var i=0;i<imgs.length;i++) loadImgNow(imgs[i]);
        return;
      }
      initLazyObserver();
      for(var j=0;j<imgs.length;j++) imgObserver.observe(imgs[j]);
    }
    function loadImgNow(img){
      if(!img) return;
      var src=img.getAttribute("data-src");
      if(!src||img.getAttribute("data-loaded")==="1") return;
      img.setAttribute("data-loaded","1");
      img.src=src;
      var box=closest(img,".img-box");
      if(box) box.classList.add("is-loading");
      img.addEventListener("load",function(){
        if(box){box.classList.remove("is-loading");box.classList.add("is-loaded");}
      },{once:true});
      img.addEventListener("error",function(){
        if(box){box.classList.remove("is-loading");box.classList.add("is-error");}
      },{once:true});
    }
    function ensureImgLoaded(img){
      if(img&&img.getAttribute("data-src")&&img.getAttribute("data-loaded")!=="1") loadImgNow(img);
    }
    function closest(el,sel){
      if(!el) return null;
      if(el.closest) return el.closest(sel);
      while(el){if(matches(el,sel)) return el;el=el.parentElement;}
      return null;
    }
    function matches(el,sel){
      if(!el) return false;
      var p=Element.prototype;
      var f=p.matches||p.webkitMatchesSelector||p.msMatchesSelector;
      return f ? f.call(el,sel) : false;
    }

    /* ═══ Google Sheets Fetch ═══ */
    function buildGvizUrl(baseUrl,query){
      try{
        var u=new URL(baseUrl);
        u.searchParams.set("tqx","out:json");
        if(query) u.searchParams.set("tq",query);
        return u.toString();
      }catch(e){
        var url=String(baseUrl||"");
        var hasQ=url.indexOf("?")>=0;
        if(!/[\?&]tqx=/.test(url)){url+=(hasQ?"&":"?")+"tqx=out:json";hasQ=true;}
        if(query) url+=(hasQ?"&":"?")+"tq="+encodeURIComponent(query);
        return url;
      }
    }
    function buildQuerySince(startDateStr){
      var A=CONFIG.queryDateColumn;
      var literal=(CONFIG.dateColumnType==="date")?("date '"+startDateStr+"'"):("'"+startDateStr+"'");
      return "select A,B,C,D,E,F,G,H where "+A+" >= "+literal+" order by "+A+" desc";
    }
    function fetchText(url){
      if(typeof window.fetch==="function"){
        return fetch(url,{method:"GET",credentials:"omit"}).then(function(res){
          if(!res.ok) throw new Error("HTTP "+res.status);
          return res.text();
        });
      }
      return new Promise(function(resolve,reject){
        var xhr=new XMLHttpRequest();
        xhr.open("GET",url,true);
        xhr.onreadystatechange=function(){
          if(xhr.readyState!==4) return;
          if(xhr.status>=200&&xhr.status<300) resolve(xhr.responseText);
          else reject(new Error("HTTP "+xhr.status));
        };
        xhr.onerror=function(){reject(new Error("네트워크 오류"));};
        xhr.send();
      });
    }
    function extractGvizObjectString(text){
      var m=String(text).match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\)\s*;?\s*$/);
      if(!m) throw new Error("gviz 응답 형식 오류");
      return m[1];
    }
    function parseGviz(text){
      var s=extractGvizObjectString(text);
      try{return JSON.parse(s);}catch(e){
        try{return (new Function("return ("+s+");"))();}catch(e2){
          throw new Error("gviz 파싱 실패");
        }
      }
    }
    function normalizeDateCell(val){
      var iso=toISODateStringLoose(val);
      return isValidISODateString(iso)?iso:"";
    }
    function toItemListFromGviz(gviz){
      if(!gviz||!gviz.table||!Array.isArray(gviz.table.rows)) return {items:[],warnings:[]};
      var cols=gviz.table.cols||[];
      var labelToIdx={};
      for(var i=0;i<cols.length;i++){
        var c=cols[i]||{};
        var label=(c.label!=null)?String(c.label).trim().toLowerCase():"";
        if(label) labelToIdx[label]=i;
      }
      var idxDate=(typeof labelToIdx["date"]==="number")?labelToIdx["date"]:0;
      var idxTitle=(typeof labelToIdx["title"]==="number")?labelToIdx["title"]:1;
      var imgIdxs=[];
      for(var k=1;k<=6;k++){
        var key="img"+k;
        var idx=labelToIdx[key];
        if(typeof idx!=="number") idx=1+k;
        imgIdxs.push(idx);
      }
      var items=[],warnings=[];
      var rows=gviz.table.rows;
      for(var r=0;r<rows.length;r++){
        var row=rows[r]||{};
        var cells=row.c||[];
        function getV(idx){return(cells[idx]&&typeof cells[idx].v!=="undefined")?cells[idx].v:"";}
        var rawDateValue=getV(idxDate);
        var rawDateText=String(rawDateValue==null?"":rawDateValue).trim();
        var date=normalizeDateCell(rawDateValue);
        var title=String(getV(idxTitle)||"").trim();
        var images=[];
        for(var j=0;j<imgIdxs.length;j++){
          var v=normalizeImageSource(getV(imgIdxs[j]));
          if(v) images.push(v);
        }
        images=uniqueList(images).slice(0,6);
        if(!date){
          if(!rawDateText&&!title&&!images.length) continue;
          if(rawDateText.toLowerCase()==="date") continue;
          warnings.push("시트 행 "+(r+1)+": 날짜는 YYYY-MM-DD 형식만 허용됩니다.");
          continue;
        }
        if(!images.length){
          warnings.push("시트 행 "+(r+1)+": 이미지(img1~img6) 1개 이상이 필요합니다.");
          continue;
        }
        items.push({date:date,title:title,images:images});
      }
      items.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
      items=dedupeItemsByDate(items,warnings,"시트");
      return {items:items,warnings:warnings};
    }
    function fetchItemsSince(startDateStr){
      if(!SHEETS_JSON_URL) return Promise.reject(new Error("SHEETS_JSON_URL 미설정"));
      var query=buildQuerySince(startDateStr);
      var url=buildGvizUrl(SHEETS_JSON_URL,query);
      return fetchText(url).then(function(text){
        var gviz=parseGviz(text);
        if(gviz.status&&gviz.status==="error"){
          var msg="시트 에러";
          if(gviz.errors&&gviz.errors[0]) msg=gviz.errors[0].detailed_message||gviz.errors[0].message||msg;
          throw new Error(msg);
        }
        var parsed=toItemListFromGviz(gviz);
        return parsed.items;
      });
    }

    /* ═══ XSS-safe ═══ */
    function escapeHtml(s){
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    function escapeHtmlAttr(s){ return escapeHtml(String(s)).replace(/\n/g," "); }

    /* ═══ 이미지 박스 ═══ */
    function createImgBox(src,alt){
      var box=document.createElement("div");
      box.className="img-box";
      box.innerHTML='<img loading="lazy" decoding="async" data-src="'+escapeHtmlAttr(src)+'" alt="'+escapeHtmlAttr(alt||"")+'">'+'<span class="img-error-text">이미지를 불러올 수 없어요</span>';
      return box;
    }

    /* ═══ Carousel ═══ */
    var supportsPassive=false;
    try{window.addEventListener("test",null,Object.defineProperty({},"passive",{get:function(){supportsPassive=true;}}));}catch(e){}

    function createCarousel(images,mode,onIndexChange){
      var root=document.createElement("div");root.className="carousel";
      var viewport=document.createElement("div");viewport.className="carousel-viewport";
      var track=document.createElement("div");track.className="carousel-track";
      var dots=document.createElement("div");dots.className="dots";
      var imgList=(images&&images.length)?images.slice():[""];
      dots.hidden=imgList.length<=1;

      for(var i=0;i<imgList.length;i++){
        var slide=document.createElement("div");slide.className="slide";
        if(imgList[i]) slide.appendChild(createImgBox(imgList[i],(mode==="modal"?"카드뉴스":"오늘의 카드뉴스")+" "+(i+1)));
        else{var ph=document.createElement("div");ph.className="img-box is-error";ph.innerHTML='<span class="img-error-text">이미지가 없습니다</span>';slide.appendChild(ph);}
        track.appendChild(slide);
        var dot=document.createElement("span");dot.className="dot";dot.setAttribute("aria-hidden","true");dots.appendChild(dot);
      }
      viewport.appendChild(track);root.appendChild(viewport);root.appendChild(dots);

      var idx=0,width=1;
      function measure(){var w=viewport.getBoundingClientRect().width;if(!w||w<2) w=viewport.offsetWidth;width=(w&&w>=2)?w:1;applyTransform(false);}
      function applyTransform(anim){
        track.style.transition=anim?"transform 220ms ease":"none";
        track.style.transform="translate3d("+(-idx*width)+"px,0,0)";
        var dotEls=dots.querySelectorAll(".dot");
        for(var i=0;i<dotEls.length;i++) dotEls[i].classList.toggle("active",i===idx);
        var slides=track.children;
        ensureImgLoaded(slides[idx]&&slides[idx].querySelector("img[data-src]"));
        ensureImgLoaded(slides[idx-1]&&slides[idx-1].querySelector("img[data-src]"));
        ensureImgLoaded(slides[idx+1]&&slides[idx+1].querySelector("img[data-src]"));
        if(typeof onIndexChange==="function") onIndexChange(idx,imgList.length);
      }
      function clampIndex(n){var max=Math.max(0,imgList.length-1);return n<0?0:n>max?max:n;}
      function goTo(n,anim){if(anim===void 0) anim=true;idx=clampIndex(n);applyTransform(anim);}

      var startX=0,startY=0,dragging=false,dragDx=0,isH=null;
      function onTS(e){if(!e.touches||e.touches.length!==1)return;dragging=true;isH=null;dragDx=0;startX=e.touches[0].clientX;startY=e.touches[0].clientY;track.style.transition="none";}
      function onTM(e){if(!dragging||!e.touches||e.touches.length!==1)return;var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(isH===null)isH=Math.abs(dx)>Math.abs(dy);if(!isH){dragging=false;track.style.transition="transform 220ms ease";applyTransform(true);return;}e.preventDefault();dragDx=dx;track.style.transform="translate3d("+((-idx*width)+dx)+"px,0,0)";}
      function onTE(){if(!dragging)return;dragging=false;if(Math.abs(dragDx)>=CONFIG.swipeThresholdPx){dragDx<0?goTo(idx+1,true):goTo(idx-1,true);}else goTo(idx,true);dragDx=0;}

      var mSX=0,mSY=0,mD=false,mDx=0,mH=null;
      function detM(){window.removeEventListener("mousemove",onMM);window.removeEventListener("mouseup",onMU);window.removeEventListener("mouseleave",onMU);}
      function onMD(e){if(e.button!==0)return;mD=true;mH=null;mDx=0;mSX=e.clientX;mSY=e.clientY;track.style.transition="none";e.preventDefault();window.addEventListener("mousemove",onMM);window.addEventListener("mouseup",onMU);window.addEventListener("mouseleave",onMU);}
      function onMM(e){if(!mD)return;var dx=e.clientX-mSX,dy=e.clientY-mSY;if(mH===null)mH=Math.abs(dx)>Math.abs(dy);if(!mH){mD=false;detM();track.style.transition="transform 220ms ease";applyTransform(true);return;}e.preventDefault();mDx=dx;track.style.transform="translate3d("+((-idx*width)+dx)+"px,0,0)";}
      function onMU(){if(!mD)return;mD=false;detM();if(Math.abs(mDx)>=CONFIG.swipeThresholdPx){mDx<0?goTo(idx+1,true):goTo(idx-1,true);}else goTo(idx,true);mDx=0;}

      viewport.addEventListener("touchstart",onTS,supportsPassive?{passive:true}:false);
      viewport.addEventListener("touchmove",onTM,supportsPassive?{passive:false}:false);
      viewport.addEventListener("touchend",onTE,supportsPassive?{passive:true}:false);
      viewport.addEventListener("touchcancel",onTE,supportsPassive?{passive:true}:false);
      viewport.addEventListener("mousedown",onMD);
      viewport.addEventListener("dragstart",function(e){e.preventDefault();});
      window.addEventListener("resize",function(){measure();},supportsPassive?{passive:true}:false);

      function init(){
        idx=0;measure();goTo(0,false);observeLazyImgs(root);
        if(width<=1) requestAnimationFrame(function(){measure();goTo(0,false);});
      }
      return{el:root,init:init,goTo:goTo};
    }

    /* ═══ 공유 ═══ */
    function copyToClipboard(text){
      if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
      return new Promise(function(resolve,reject){
        try{var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;left:-9999px;top:-9999px";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);ok?resolve():reject();}catch(e){reject(e);}
      });
    }
    function shareToday(){
      var url=location.href,title="염광사 일간 뉴스",text=state.todayItem&&state.todayItem.title?state.todayItem.title:"오늘의 카드뉴스";
      if(navigator.share){navigator.share({title:title,text:text,url:url}).catch(function(){});return;}
      copyToClipboard(url).then(function(){showToast("링크가 복사되었습니다");}).catch(function(){showToast("주소를 직접 복사해주세요");});
    }

    /* ═══ Modal Arrows ═══ */
    function updateModalArrows(i,total){
      if(!els.modalPrev||!els.modalNext) return;
      if(!total||total<=1){els.modalPrev.hidden=true;els.modalNext.hidden=true;return;}
      els.modalPrev.hidden=(i<=0);
      els.modalNext.hidden=(i>=total-1);
    }

    /* ═══ Modal ═══ */
    function lockBodyScroll(){state.scrollY=window.scrollY||0;document.body.classList.add("is-locked");document.body.style.top="-"+state.scrollY+"px";}
    function unlockBodyScroll(){document.body.classList.remove("is-locked");document.body.style.top="";window.scrollTo(0,state.scrollY);}

    function openModal(item){
      if(!item) return;
      state.modalOpen=true;
      els.modalDate.textContent=formatDateKorean(item.date);
      els.modalTitle.textContent=item.title||"";
      els.modalCarouselMount.innerHTML="";
      var total=Math.max(1,(item.images||[]).length);
      els.modalCounter.textContent="1 / "+total;

      var carousel=createCarousel(item.images||[],"modal",function(i,total){
        state.modalIndex=i;state.modalTotal=total;
        els.modalCounter.textContent=(i+1)+" / "+total;
        updateModalArrows(i,total);
      });
      state.modalCarouselApi=carousel;state.modalIndex=0;state.modalTotal=total;
      els.modalCarouselMount.appendChild(carousel.el);
      els.modal.classList.add("is-open");
      els.modal.setAttribute("aria-hidden","false");
      lockBodyScroll();
      carousel.init();
      updateModalArrows(0,total);

      // 모달 내 투표 바
      var modalBody=document.querySelector('.modal-body');
      var existMV=modalBody.querySelector('.vote-section');
      if(existMV) existMV.remove();
      attachVoteBar(modalBody, item.date);

      try{history.pushState({modal:true},"");}catch(e){}
    }

    function closeModal(fromPop){
      if(!state.modalOpen) return;
      state.modalOpen=false;
      els.modal.classList.remove("is-open");
      els.modal.setAttribute("aria-hidden","true");
      els.modalCarouselMount.innerHTML="";
      // 모달 내 투표 바도 제거
      var mv=document.querySelector('.modal-body .vote-section');
      if(mv) mv.remove();
      unlockBodyScroll();
      state.modalCarouselApi=null;state.modalIndex=0;state.modalTotal=0;
      updateModalArrows(0,0);
      if(!fromPop){try{history.back();}catch(e){}}
    }

    els.modalOverlay.addEventListener("click",function(){closeModal(false);});
    els.modalClose.addEventListener("click",function(){closeModal(false);});
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal(false);});
    window.addEventListener("popstate",function(){if(state.modalOpen)closeModal(true);});
    if(els.modalPrev) els.modalPrev.addEventListener("click",function(e){e.preventDefault();if(state.modalCarouselApi) state.modalCarouselApi.goTo(state.modalIndex-1,true);});
    if(els.modalNext) els.modalNext.addEventListener("click",function(e){e.preventDefault();if(state.modalCarouselApi) state.modalCarouselApi.goTo(state.modalIndex+1,true);});

    /* ═══ Render ═══ */
    function setError(msg){els.archiveError.textContent=msg||"";els.archiveError.hidden=!msg;}

    function renderToday(todayItem){
      els.todayCarouselMount.innerHTML="";
      els.todayTitle.textContent="";
      els.todayEmpty.hidden=true;
      els.shareBtn.hidden=true;
      state.todayItem=todayItem||null;

      // 이전 투표 바 제거
      var prevVote=document.getElementById('todayBleed').querySelector('.vote-section');
      if(prevVote) prevVote.remove();

      if(!todayItem||!todayItem.images||!todayItem.images.length){
        els.todayEmpty.hidden=false;
        return;
      }
      var carousel=createCarousel(todayItem.images,"today",function(){});
      els.todayCarouselMount.appendChild(carousel.el);
      carousel.init();
      els.todayTitle.textContent=todayItem.title||"";
      els.shareBtn.hidden=false;

      // 오늘의 카드뉴스 아래 투표 바 삽입
      attachVoteBar(document.getElementById('todayBleed'), todayItem.date);
    }

    function renderArchive(items){
      els.archiveList.innerHTML="";
      els.archiveEmpty.hidden=true;
      if(!items||!items.length){els.archiveEmpty.hidden=false;return;}
      var sorted=items.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
      for(var i=0;i<sorted.length;i++){
        (function(item){
          var btn=document.createElement("button");
          btn.type="button";btn.className="news-item";
          btn.setAttribute("aria-label",item.date+" "+(item.title||"")+" 상세 보기");
          var thumb=document.createElement("div");thumb.className="thumb";
          thumb.appendChild(createImgBox(item.images[0],item.date+" 썸네일"));
          var meta=document.createElement("div");meta.className="news-meta";
          meta.innerHTML='<div class="news-date">'+escapeHtml(formatDateKoreanWithWeekday(item.date))+'</div>'+'<div class="news-title">'+escapeHtml(item.title||"")+'</div>';
          btn.appendChild(thumb);btn.appendChild(meta);
          btn.addEventListener("click",function(){openModal(item);});
          els.archiveList.appendChild(btn);
        })(sorted[i]);
      }
      observeLazyImgs(els.archiveList);
    }

    /* ═══ Accordion ═══ */
    function setArchiveOpen(open){
      els.archivePanel.hidden=!open;
      els.archiveToggle.setAttribute("aria-expanded",open?"true":"false");
      els.archiveChev.textContent=open?"▲":"▼";
      if(open) observeLazyImgs(els.archivePanel);
    }
    els.archiveToggle.addEventListener("click",function(){
      var isOpen=els.archiveToggle.getAttribute("aria-expanded")==="true";
      setArchiveOpen(!isOpen);
    });

    /* ══════════════════════════════════════
       투표 피드백 시스템
       ══════════════════════════════════════ */

    /* ── localStorage 중복 방지 ── */
    function getVoteKey(date){return 'yk_vote_'+date;}
    function getPrevVote(date){try{return localStorage.getItem(getVoteKey(date));}catch(e){return null;}}
    function savePrevVote(date,vote){try{localStorage.setItem(getVoteKey(date),vote);}catch(e){}}

    /* ── 투표 섹션 생성 ── */
    function createVoteSection(date){
      var section=document.createElement('div');
      section.className='vote-section';
      section.setAttribute('data-vote-date',date);

      section.innerHTML=
        '<div class="vote-prompt" data-role="prompt">'+
          '<div class="vote-prompt-main">오늘 콘텐츠, 어떠셨나요?</div>'+
          '<div class="vote-prompt-sub">사장님의 터치 하나가 더 도움되는 뉴스를 만듭니다</div>'+
        '</div>'+
        '<div class="vote-row">'+
          '<button type="button" class="vote-btn vote-good" aria-label="도움됐어요">'+
            '<span class="vote-emoji">👍</span>'+
            '<span>도움됐어요</span>'+
            '<span class="vote-count" data-role="good-count"></span>'+
          '</button>'+
          '<button type="button" class="vote-btn vote-bad" aria-label="아쉬워요">'+
            '<span class="vote-emoji">🤔</span>'+
            '<span>아쉬워요</span>'+
            '<span class="vote-count" data-role="bad-count"></span>'+
          '</button>'+
        '</div>'+
        '<div class="vote-thanks" data-role="thanks">'+
          '<div class="vote-thanks-text" data-role="thanks-text"></div>'+
        '</div>';

      // 클릭 이벤트
      var goodBtn=section.querySelector('.vote-good');
      var badBtn=section.querySelector('.vote-bad');

      goodBtn.addEventListener('click',function(e){
        e.stopPropagation();
        handleVoteClick(section,'good');
      });
      badBtn.addEventListener('click',function(e){
        e.stopPropagation();
        handleVoteClick(section,'bad');
      });

      return section;
    }

    /* ── 파티클 이펙트 (좋아요 시 👍 날아오르기) ── */
    function spawnParticles(btn){
      var emojis=['👍','✨','💙'];
      for(var i=0;i<3;i++){
        (function(delay,emoji){
          setTimeout(function(){
            var p=document.createElement('span');
            p.className='vote-particle';
            p.textContent=emoji;
            p.style.left=(30 + Math.random()*40)+'%';
            btn.appendChild(p);
            setTimeout(function(){if(p.parentNode) p.parentNode.removeChild(p);},750);
          },delay);
        })(i*120, emojis[i%emojis.length]);
      }
    }

    /* ── 투표 클릭 처리 ── */
    function handleVoteClick(section,vote){
      var date=section.getAttribute('data-vote-date');

      if(getPrevVote(date)){
        showToast('이미 의견을 보내주셨어요 😊');
        return;
      }

      var goodBtn=section.querySelector('.vote-good');
      var badBtn=section.querySelector('.vote-bad');
      var prompt=section.querySelector('[data-role="prompt"]');
      var thanksText=section.querySelector('[data-role="thanks-text"]');

      // 팝 애니메이션
      var activeBtn=(vote==='good')?goodBtn:badBtn;
      activeBtn.classList.add('is-popping');
      setTimeout(function(){activeBtn.classList.remove('is-popping');},400);

      // 상태 반영
      if(vote==='good'){
        goodBtn.classList.add('is-voted-good');
        badBtn.classList.add('is-disabled');
        spawnParticles(goodBtn);
        var gc=goodBtn.querySelector('[data-role="good-count"]');
        var gn=parseInt(gc.textContent)||0;
        gc.textContent=gn+1;
      }else{
        badBtn.classList.add('is-voted-bad');
        goodBtn.classList.add('is-disabled');
        var bc=badBtn.querySelector('[data-role="bad-count"]');
        var bn=parseInt(bc.textContent)||0;
        bc.textContent=bn+1;
      }

      // 안내 멘트 → 감사 메시지로 전환
      if(prompt) prompt.style.display='none';
      if(thanksText){
        if(vote==='good'){
          thanksText.textContent='감사합니다! 사장님께 더 도움되는 뉴스로 보답할게요 💙';
        }else{
          thanksText.textContent='솔직한 의견 감사합니다. 더 알찬 내용으로 준비할게요 🙏';
        }
        // 약간의 딜레이 후 페이드인
        setTimeout(function(){thanksText.classList.add('is-visible');},150);
      }

      savePrevVote(date,vote);

      // 같은 날짜 다른 투표 섹션 동기화 (오늘 카드 + 모달 동시 존재)
      syncAllVoteSections(date,vote);

      // 서버 전송
      if(!VOTE_SCRIPT_URL) return;
      var url=VOTE_SCRIPT_URL+'?date='+encodeURIComponent(date)+'&vote='+encodeURIComponent(vote);
      fetch(url,{mode:'no-cors'}).catch(function(){});
    }

    /* ── 동기화 ── */
    function syncAllVoteSections(date,vote){
      var sections=document.querySelectorAll('.vote-section[data-vote-date="'+date+'"]');
      for(var i=0;i<sections.length;i++){
        var s=sections[i];
        var g=s.querySelector('.vote-good');
        var b=s.querySelector('.vote-bad');
        var pr=s.querySelector('[data-role="prompt"]');
        var tt=s.querySelector('[data-role="thanks-text"]');

        if(vote==='good'){
          g.classList.add('is-voted-good');
          b.classList.add('is-disabled');
        }else{
          b.classList.add('is-voted-bad');
          g.classList.add('is-disabled');
        }
        if(pr) pr.style.display='none';
        if(tt&&!tt.classList.contains('is-visible')){
          tt.textContent=(vote==='good')?'감사합니다! 사장님께 더 도움되는 뉴스로 보답할게요 💙':'솔직한 의견 감사합니다. 더 알찬 내용으로 준비할게요 🙏';
          setTimeout(function(el){return function(){el.classList.add('is-visible');};}(tt),150);
        }
      }
    }

    /* ── 투표 수 로드 ── */
    function loadVoteCounts(date,section){
      if(!VOTE_SCRIPT_URL) return;
      var url=VOTE_SCRIPT_URL+'?mode=count&date='+encodeURIComponent(date);
      fetch(url).then(function(r){return r.json();}).then(function(data){
        if(data.status!=='ok') return;
        var gc=section.querySelector('[data-role="good-count"]');
        var bc=section.querySelector('[data-role="bad-count"]');
        if(gc&&data.good) gc.textContent=data.good;
        if(bc&&data.bad) bc.textContent=data.bad;
      }).catch(function(){});
    }

    /* ── 이전 투표 상태 복원 ── */
    function restoreVoteState(section){
      var date=section.getAttribute('data-vote-date');
      var prev=getPrevVote(date);
      if(!prev) return;

      var g=section.querySelector('.vote-good');
      var b=section.querySelector('.vote-bad');
      var pr=section.querySelector('[data-role="prompt"]');
      var tt=section.querySelector('[data-role="thanks-text"]');

      if(prev==='good'){
        g.classList.add('is-voted-good');
        b.classList.add('is-disabled');
      }else{
        b.classList.add('is-voted-bad');
        g.classList.add('is-disabled');
      }

      // 이미 투표한 경우 안내 멘트 → 감사 메시지
      if(pr) pr.style.display='none';
      if(tt){
        tt.textContent=(prev==='good')?'사장님의 응원이 큰 힘이 됩니다 💙':'소중한 의견, 반영하고 있어요 🙏';
        tt.classList.add('is-visible');
      }
    }

    /* ── 투표 바 삽입 헬퍼 ── */
    function attachVoteBar(parentEl,date){
      var section=createVoteSection(date);
      parentEl.appendChild(section);
      restoreVoteState(section);
      loadVoteCounts(date,section);
      return section;
    }

    /* ═══ Init ═══ */
    (function init(){
      state.todayStr=getTodayKSTString();
      els.headerDate.textContent=formatDateKorean(state.todayStr);

      var start=shiftDateString(state.todayStr,-CONFIG.archiveDays);
      var endArchive=shiftDateString(state.todayStr,-1);
      els.archiveRange.textContent=formatDateKorean(start)+" ~ "+formatDateKorean(endArchive);
      setArchiveOpen(false);

      els.shareBtn.addEventListener("click",function(){shareToday();});

      setError("");
      fetchItemsSince(start).then(function(raw){
        var end=state.todayStr;
        var ranged=raw.filter(function(it){return it.date>=start&&it.date<=end;});

        var todayItem=null;
        for(var i=0;i<ranged.length;i++){
          if(ranged[i].date===state.todayStr){todayItem=ranged[i];break;}
        }

        var archiveItems=ranged.filter(function(it){return it.date>=start&&it.date<=endArchive;});
        state.archiveItems=archiveItems;

        if(els.archiveCountBadge) els.archiveCountBadge.textContent=archiveItems.length+"건";

        renderToday(todayItem);
        renderArchive(archiveItems);

      }).catch(function(e){
        renderToday(null);
        els.archiveEmpty.hidden=false;
        setError(e&&e.message?e.message:"데이터를 불러오지 못했습니다.");
        if(els.archiveCountBadge) els.archiveCountBadge.textContent="0건";
      });
    })();

    /* ═══ 헤더 축소 ═══ */
    (function initHeaderShrink(){
      if(!els.appHeader) return;
      var ticking=false;
      function apply(){ticking=false;els.appHeader.classList.toggle("is-compact",(window.scrollY||0)>=50);}
      function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(apply);}
      window.addEventListener("scroll",onScroll,supportsPassive?{passive:true}:false);
      apply();
    })();
  </script>
</body>
</html>
