<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일간뉴스 인스타 스타일 미리보기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#eef3fa;
      --ink:#0b1321;
      --sub:#526079;
      --line:#dbe4f1;
      --brand:#0c63db;
      --brand-soft:#eaf3ff;
      --card:#ffffff;
      --like:#ff4d79;
      --radius:16px;
      --shadow:0 20px 40px rgba(11, 19, 33, 0.1);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 14% 0%, rgba(12,99,219,0.18) 0%, rgba(12,99,219,0) 36%),
        radial-gradient(circle at 100% 10%, rgba(255,77,121,0.12) 0%, rgba(255,77,121,0) 34%),
        var(--bg);
      font-family:"Nanum Gothic", sans-serif;
    }
    .shell{
      width:min(760px, calc(100vw - 24px));
      margin:12px auto 30px;
      background:rgba(255,255,255,0.74);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.8);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .top{
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .title{
      margin:0;
      font-family:"Manrope", sans-serif;
      font-size:19px;
      letter-spacing:-0.2px;
      font-weight:800;
    }
    .badge{
      border:1px solid #bfd6ff;
      background:#edf5ff;
      color:#1e57b7;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      padding:6px 9px;
      line-height:1;
      white-space:nowrap;
    }
    .body{
      padding:14px;
      display:grid;
      gap:14px;
    }
    .feed{
      background:var(--card);
      border:1px solid #e4ecf8;
      border-radius:var(--radius);
      overflow:hidden;
    }
    .feed-head{
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .feed-head strong{
      font-size:13px;
      font-weight:800;
      letter-spacing:-0.1px;
    }
    .feed-head span{
      font-size:11px;
      color:var(--sub);
      font-weight:700;
      white-space:nowrap;
    }
    .stage{
      position:relative;
      background:#e9f0f9;
      aspect-ratio:1/1;
      overflow:hidden;
    }
    .stage img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity:0;
      transition:opacity 220ms ease;
    }
    .stage img.show{opacity:1;}
    .nav{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      border:0;
      width:34px;
      height:34px;
      border-radius:999px;
      color:#fff;
      background:rgba(0,0,0,0.32);
      font-size:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .nav.prev{left:8px;}
    .nav.next{right:8px;}
    .dots{
      position:absolute;
      left:50%;
      bottom:9px;
      transform:translateX(-50%);
      display:flex;
      gap:6px;
    }
    .dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background:rgba(255,255,255,0.6);
    }
    .dot.active{
      width:18px;
      background:#fff;
    }
    .actions{
      padding:10px 12px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .left-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .icon-btn{
      border:1px solid #d6e2f4;
      background:#f7faff;
      color:#1f427f;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      padding:7px 10px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      cursor:pointer;
      line-height:1;
    }
    .icon-btn.like.on{
      border-color:#ffc4d2;
      background:#fff1f5;
      color:#ad204d;
    }
    .metrics{
      color:#334767;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .caption{
      padding:0 12px 10px;
      font-size:13px;
      font-weight:700;
      color:#1d2d4a;
      line-height:1.52;
    }
    .comment-wrap{
      border-top:1px solid var(--line);
      padding:10px 12px 12px;
      background:#fbfdff;
    }
    .comment-list{
      margin:0;
      padding:0;
      list-style:none;
      display:grid;
      gap:7px;
      max-height:148px;
      overflow:auto;
    }
    .comment{
      background:#fff;
      border:1px solid #e3ecf8;
      border-radius:10px;
      padding:8px 9px;
      font-size:12px;
      line-height:1.45;
    }
    .comment b{
      color:#224a93;
      font-weight:800;
      margin-right:6px;
    }
    .comment-form{
      margin-top:8px;
      display:grid;
      grid-template-columns: 1fr auto;
      gap:8px;
    }
    .comment-input{
      border:1px solid #d6e4fa;
      border-radius:10px;
      background:#fff;
      font-size:12px;
      padding:9px 10px;
      font-family:"Nanum Gothic", sans-serif;
    }
    .submit{
      border:0;
      border-radius:10px;
      background:linear-gradient(180deg, #0d67e2 0%, #0952ba 100%);
      color:#fff;
      font-size:12px;
      font-weight:800;
      padding:9px 11px;
      cursor:pointer;
    }
    .archive{
      background:#fff;
      border:1px solid #e4ecf8;
      border-radius:var(--radius);
      padding:12px;
    }
    .archive-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .archive-head h2{
      margin:0;
      font-size:14px;
      font-weight:900;
      letter-spacing:-0.15px;
    }
    .archive-head span{
      color:#4d6284;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:8px;
    }
    .thumb{
      border:1px solid #dae6f7;
      background:#edf3fb;
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      position:relative;
      padding:0;
    }
    .thumb img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      transition:transform 180ms ease;
    }
    .thumb:hover img{transform:scale(1.03);}
    .thumb::after{
      content:attr(data-date);
      position:absolute;
      left:6px;
      bottom:6px;
      border-radius:999px;
      font-size:10px;
      font-weight:800;
      padding:4px 6px;
      line-height:1;
      color:#fff;
      background:rgba(8, 22, 48, 0.66);
      backdrop-filter: blur(3px);
    }
    .preview-note{
      margin:2px 0 0;
      color:#60708a;
      font-size:11px;
      font-weight:700;
    }
    @media (max-width:680px){
      .shell{
        width:100vw;
        margin:0;
        border-radius:0;
        min-height:100vh;
      }
      .grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <h1 class="title">일간 뉴스 피드</h1>
      <span class="badge">Instagram-style Preview</span>
    </header>

    <main class="body">
      <section class="feed">
        <div class="feed-head">
          <strong id="feedTitle">오늘의 카드뉴스</strong>
          <span id="feedDate">2026.03.06</span>
        </div>
        <div class="stage">
          <img id="mainImage" src="../customer/images/2026-03-03/1.png" alt="오늘 카드뉴스 이미지" class="show" />
          <button class="nav prev" id="prevBtn" type="button" aria-label="이전">‹</button>
          <button class="nav next" id="nextBtn" type="button" aria-label="다음">›</button>
          <div class="dots" id="dots"></div>
        </div>
        <div class="actions">
          <div class="left-actions">
            <button class="icon-btn like" id="likeBtn" type="button">♡ 좋아요</button>
            <button class="icon-btn" id="commentFocusBtn" type="button">💬 댓글</button>
          </div>
          <div class="metrics" id="metricsText">좋아요 0 · 댓글 0</div>
        </div>
        <div class="caption" id="captionText">사장님이 바로 써먹는 매출 팁 요약 카드</div>
        <div class="comment-wrap">
          <ul class="comment-list" id="commentList"></ul>
          <form class="comment-form" id="commentForm">
            <input class="comment-input" id="commentInput" type="text" maxlength="120" placeholder="댓글을 입력하세요 (최대 120자)" />
            <button class="submit" type="submit">등록</button>
          </form>
        </div>
      </section>

      <section class="archive">
        <div class="archive-head">
          <h2>아카이브 썸네일</h2>
          <span>최근 14일</span>
        </div>
        <div class="grid" id="archiveGrid"></div>
        <p class="preview-note">썸네일 클릭 시 상단 메인 피드가 해당 날짜 카드로 바뀝니다.</p>
      </section>
    </main>
  </div>

  <script>
    (function(){
      var baseImages = [
        "../customer/images/2026-03-03/1.png",
        "../customer/images/2026-03-03/2.png",
        "../customer/images/2026-03-03/3.png",
        "../customer/images/2026-03-03/4.png",
        "../customer/images/2026-03-03/5.png"
      ];

      function pad2(n){ return String(n).padStart(2, "0"); }
      function shiftDate(baseDate, delta){
        var dt = new Date(baseDate.getTime());
        dt.setDate(dt.getDate() + delta);
        return dt;
      }
      function toKeyDate(dt){
        return dt.getFullYear() + "-" + pad2(dt.getMonth()+1) + "-" + pad2(dt.getDate());
      }
      function toLabelDate(dt){
        return dt.getFullYear() + "." + pad2(dt.getMonth()+1) + "." + pad2(dt.getDate());
      }

      var today = new Date(2026, 2, 6);
      var posts = [];
      for(var i=0;i<14;i++){
        var d = shiftDate(today, -i);
        var key = toKeyDate(d);
        var imgs = [];
        for(var j=0;j<5;j++){
          imgs.push(baseImages[(i + j) % baseImages.length]);
        }
        posts.push({
          id:key,
          title:(i===0 ? "오늘의 카드뉴스" : "일간 뉴스 아카이브"),
          caption:(i===0 ? "사장님이 바로 써먹는 매출 팁 요약 카드" : "운영/마케팅 핵심을 5장 카드로 압축"),
          dateLabel:toLabelDate(d),
          images:imgs,
          baseLikes:26 + (14 - i) * 3
        });
      }

      var state = {
        currentPost: 0,
        currentSlide: 0
      };

      var els = {
        feedTitle: document.getElementById("feedTitle"),
        feedDate: document.getElementById("feedDate"),
        mainImage: document.getElementById("mainImage"),
        dots: document.getElementById("dots"),
        prevBtn: document.getElementById("prevBtn"),
        nextBtn: document.getElementById("nextBtn"),
        likeBtn: document.getElementById("likeBtn"),
        metricsText: document.getElementById("metricsText"),
        captionText: document.getElementById("captionText"),
        commentList: document.getElementById("commentList"),
        commentForm: document.getElementById("commentForm"),
        commentInput: document.getElementById("commentInput"),
        commentFocusBtn: document.getElementById("commentFocusBtn"),
        archiveGrid: document.getElementById("archiveGrid")
      };

      function likeKey(post){ return "insta_preview_like_" + post.id; }
      function commentKey(post){ return "insta_preview_comments_" + post.id; }

      function getLiked(post){
        try { return localStorage.getItem(likeKey(post)) === "1"; }
        catch(e){ return false; }
      }
      function setLiked(post, val){
        try { localStorage.setItem(likeKey(post), val ? "1" : "0"); } catch(e){}
      }
      function getComments(post){
        try {
          var raw = localStorage.getItem(commentKey(post));
          var arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch(e){
          return [];
        }
      }
      function setComments(post, arr){
        try { localStorage.setItem(commentKey(post), JSON.stringify(arr || [])); } catch(e){}
      }

      function renderDots(post){
        els.dots.innerHTML = "";
        for(var i=0;i<post.images.length;i++){
          var d = document.createElement("span");
          d.className = "dot" + (i===state.currentSlide ? " active" : "");
          els.dots.appendChild(d);
        }
      }

      function renderComments(post){
        var comments = getComments(post);
        els.commentList.innerHTML = "";
        if(!comments.length){
          var li = document.createElement("li");
          li.className = "comment";
          li.innerHTML = "<b>안내</b>첫 댓글을 남겨보세요.";
          els.commentList.appendChild(li);
          return comments.length;
        }
        for(var i=0;i<comments.length;i++){
          var item = comments[i];
          var li2 = document.createElement("li");
          li2.className = "comment";
          li2.innerHTML = "<b>"+ item.author +"</b>" + item.text;
          els.commentList.appendChild(li2);
        }
        return comments.length;
      }

      function renderMetrics(post){
        var liked = getLiked(post);
        var comments = getComments(post);
        var likes = post.baseLikes + (liked ? 1 : 0);
        els.likeBtn.classList.toggle("on", liked);
        els.likeBtn.textContent = (liked ? "♥ 좋아요" : "♡ 좋아요");
        els.metricsText.textContent = "좋아요 " + likes + " · 댓글 " + comments.length;
      }

      function renderPost(){
        var post = posts[state.currentPost];
        els.feedTitle.textContent = post.title;
        els.feedDate.textContent = post.dateLabel;
        els.captionText.textContent = post.caption;
        if(state.currentSlide >= post.images.length) state.currentSlide = 0;

        els.mainImage.classList.remove("show");
        setTimeout(function(){
          els.mainImage.src = post.images[state.currentSlide];
          els.mainImage.classList.add("show");
        }, 90);

        renderDots(post);
        renderMetrics(post);
        renderComments(post);
      }

      function moveSlide(delta){
        var post = posts[state.currentPost];
        state.currentSlide += delta;
        if(state.currentSlide < 0) state.currentSlide = post.images.length - 1;
        if(state.currentSlide >= post.images.length) state.currentSlide = 0;
        renderPost();
      }

      function bindActions(){
        els.prevBtn.addEventListener("click", function(){ moveSlide(-1); });
        els.nextBtn.addEventListener("click", function(){ moveSlide(1); });

        els.likeBtn.addEventListener("click", function(){
          var post = posts[state.currentPost];
          var liked = getLiked(post);
          setLiked(post, !liked);
          renderMetrics(post);
        });

        els.commentFocusBtn.addEventListener("click", function(){
          els.commentInput.focus();
        });

        els.commentForm.addEventListener("submit", function(e){
          e.preventDefault();
          var text = String(els.commentInput.value || "").trim();
          if(!text) return;
          var post = posts[state.currentPost];
          var comments = getComments(post);
          comments.unshift({author:"사장님", text:text});
          if(comments.length > 30) comments = comments.slice(0,30);
          setComments(post, comments);
          els.commentInput.value = "";
          renderMetrics(post);
          renderComments(post);
        });
      }

      function renderArchive(){
        els.archiveGrid.innerHTML = "";
        for(var i=0;i<posts.length;i++){
          (function(idx){
            var p = posts[idx];
            var b = document.createElement("button");
            b.type = "button";
            b.className = "thumb";
            b.setAttribute("data-date", p.dateLabel.slice(5));
            b.innerHTML = "<img src='"+ p.images[0] +"' alt='아카이브 썸네일'>";
            b.addEventListener("click", function(){
              state.currentPost = idx;
              state.currentSlide = 0;
              renderPost();
              window.scrollTo({top:0, behavior:"smooth"});
            });
            els.archiveGrid.appendChild(b);
          })(i);
        }
      }

      bindActions();
      renderArchive();
      renderPost();
    })();
  </script>
</body>
</html>
